<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Mi Bolsa</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1e293b; --muted:#64748b; --line:#e5e9f2; --soft:#eef2f8;
  --acc:#0d9488; --acc-ink:#0f766e; --acc2:#d5f5ef; --hero1:#14b8a6; --hero2:#3b82f6;
  --warn:#b45309; --warn2:#fff3d6; --red:#be123c; --red2:#ffe4ea; --blue:#1d4ed8; --blue2:#e0eaff;
  --green:#15803d; --green2:#dcfce7; --shadow:0 6px 24px rgba(30,41,59,.07);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220; --card:#131c2e; --ink:#e7edf7; --muted:#93a1b8; --line:#24314a; --soft:#1a2539;
    --acc:#2dd4bf; --acc-ink:#5eead4; --acc2:#123c3a; --hero1:#0f766e; --hero2:#1e40af;
    --warn:#fbbf24; --warn2:#3a2c0d; --red:#fb7185; --red2:#3b1220; --blue:#93b4ff; --blue2:#16264a;
    --green:#4ade80; --green2:#0f2f1d; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 20px 22px;border-radius:0 0 28px 28px}
header .fila{display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{margin:0;font-size:26px;letter-spacing:-.02em}
header p{margin:4px 0 0;color:rgba(255,255,255,.85);font-size:14px}
.lang{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:6px 12px;font:600 13px inherit}
main{padding:18px 16px;max-width:640px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
h2{font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 8px}
label.l{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:16px 0 6px}
input{width:100%;font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);outline:none}
input:focus{border-color:var(--acc)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.picker{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer}
.picker span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.picker i{font-style:normal;color:var(--muted)}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;border-radius:11px;padding:10px;font:600 15px inherit;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:0;border-radius:999px;padding:8px 12px;font:600 14px inherit;background:var(--acc2);color:var(--acc-ink);cursor:pointer}
.chip.add{background:var(--soft);color:var(--ink)}
button.main{width:100%;border:0;border-radius:16px;padding:16px;font:700 17px inherit;background:var(--acc);color:#fff;margin-top:18px;cursor:pointer}
@media (prefers-color-scheme: dark){button.main{color:#06201d}}
button.sec{border:0;border-radius:999px;padding:9px 14px;background:var(--soft);font:600 14px inherit;color:var(--ink);cursor:pointer}
button.link{border:0;background:none;color:var(--acc-ink);font:600 15px inherit;padding:8px 0;cursor:pointer}
.note{font-size:14px;color:var(--muted);margin-top:8px}
.bolsa-ed{border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.bolsa-ed .cab{display:flex;justify-content:space-between;align-items:center}
.bolsa-ed .cab b{font-size:15px}
/* Tarjeta de resultados */
.res .kicker{font-size:13px;color:var(--muted);font-weight:600}
.res .dep{font-weight:800;font-size:21px;letter-spacing:-.01em;margin-top:2px}
.res .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.badge{min-width:86px;text-align:center;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:18px;padding:10px 12px}
.badge span{display:block;font-size:11px;opacity:.9;text-transform:uppercase;letter-spacing:.05em}
.badge b{display:block;font-size:30px;line-height:1.1}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;margin-top:10px}
.t-act{background:var(--green2);color:var(--green)}.t-des{background:var(--warn2);color:var(--warn)}
.t-no{background:var(--red2);color:var(--red)}.t-dis{background:var(--blue2);color:var(--blue)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.stat{background:var(--soft);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.1}.stat span{font-size:13px;color:var(--muted)}
.stat.hl{background:var(--blue2)}.stat.hl b{color:var(--blue)}
.delta{font-size:14px;margin-top:12px;color:var(--muted)}.delta.up{color:var(--green)}
.est{background:var(--acc2);color:var(--acc-ink);border-radius:16px;padding:12px 14px;font-size:15px;margin-top:12px}
.perf{font-size:14px;margin-top:10px;color:var(--muted)}.perf b{color:var(--ink)}
.graf{margin-top:16px}.graf svg{width:100%;height:90px;display:block}
.graf .ej{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.acciones{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.err{background:var(--red2);color:var(--red);border-radius:14px;padding:12px;font-size:15px;margin-top:10px}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.bar .when{font-size:14px;color:var(--muted)}.bar>span:last-child{display:flex;gap:8px;flex-shrink:0}
.badge span{white-space:nowrap;font-size:10px}
.nov{background:linear-gradient(135deg,var(--acc2),var(--blue2))}.nov ul{margin:0;padding-left:18px}.nov li{margin:5px 0;font-size:15px}
.grupo{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:22px 4px 8px}
.reg summary{font-weight:600;cursor:pointer;color:var(--muted);font-size:15px}.reg pre{white-space:pre-wrap;font-size:12px;color:var(--muted);margin:10px 0 0}
.check{display:flex;gap:10px;align-items:center;font-size:15px;margin-top:16px;color:var(--muted)}.check input{width:auto}
.guia{counter-reset:p;padding:0;margin:10px 0 0;list-style:none}
.guia li{counter-increment:p;display:flex;gap:10px;margin:10px 0;font-size:15px}
.guia li::before{content:counter(p);flex:0 0 26px;height:26px;border-radius:50%;background:var(--acc2);color:var(--acc-ink);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
footer{font-size:13px;color:var(--muted);text-align:center;margin-top:26px;line-height:1.5}
a{color:var(--acc-ink)}
/* Buscador de categorías y departamentos */
#hoja{position:fixed;inset:0;background:rgba(2,6,23,.45);display:none;z-index:30;align-items:flex-end;justify-content:center}
#hoja .h{background:var(--card);width:100%;max-width:640px;max-height:88vh;border-radius:26px 26px 0 0;display:flex;flex-direction:column;padding:14px 16px calc(env(safe-area-inset-bottom) + 10px)}
#hoja .tira{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
#hoja .hc{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#hoja .lista{overflow:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
#hoja .op{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer}
#hoja .op small{display:block;color:var(--muted);font-size:12px}
#hoja .op.sel{color:var(--acc-ink);font-weight:700}
#hoja .sub{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:12px 6px 4px}
/* Pantalla de búsqueda */
#overlay{position:fixed;inset:0;background:rgba(2,6,23,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
#overlay .box{background:var(--card);border-radius:26px;padding:26px 22px;max-width:360px;width:100%;text-align:center;box-shadow:var(--shadow)}
#overlay b{font-size:18px}
.lupa{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(135deg,var(--hero1),var(--hero2));display:flex;align-items:center;justify-content:center;animation:lat 1.4s ease-in-out infinite}
@keyframes lat{50%{transform:scale(1.08)}}
.prog{height:8px;background:var(--soft);border-radius:8px;margin-top:16px;overflow:hidden}
.prog i{display:block;height:100%;width:5%;background:linear-gradient(90deg,var(--hero1),var(--hero2));border-radius:8px;transition:width .4s}
.ovs{font-size:14px;color:var(--muted);margin-top:8px;min-height:20px}
</style>
</head>

// Funciones que se ejecutan DENTRO de la página de la GVA (como si las tecleara la persona)
function paginaGVA() {
  const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9Ñ ]+/g, ' ').replace(/\s+/g, ' ').trim();
  const wOf = sel => window.PrimeFaces && PrimeFaces.widgets['widget_' + sel.id.replace(/_input$/, '').replace(/:/g, '_')];
  window.__mb = {
    lista() {
      const a = [...document.querySelectorAll('a')].find(x => /getListadoSituacionCandidatoIntervalo/.test(x.getAttribute('href') || ''));
      const pub = [...document.querySelectorAll('main a')].map(x => x.textContent.trim()).find(t => /Reedici|edici/i.test(t)) || '';
      return a ? { url: a.href, texto: a.textContent.trim(), pub } : null;
    },
    listo() {
      return !!(window.PrimeFaces && window.jQuery && document.querySelectorAll('#filToogle select').length >= 3 &&
        (!PrimeFaces.ajax.Queue.isEmpty || PrimeFaces.ajax.Queue.isEmpty()) && jQuery.active === 0);
    },
    elegir(i, valor) {
      const s = [...document.querySelectorAll('#filToogle select')][i];
      const w = s && wOf(s);
      if (!w) return 'sin-selector';
      if (![...s.options].some(o => o.value === valor)) return 'sin-opcion';
      let fallo = '';
      try { w.selectValue(valor); } catch (e) { fallo = String(e && e.message || e); }
      if (s.value !== valor) {
        // Plan B: elegir la opción en el desplegable original y avisar a PrimeFaces del cambio
        try { s.value = valor; jQuery(s).trigger('change'); } catch (e) { fallo += ' / ' + String(e && e.message || e); }
      }
      return s.value === valor ? 'ok' : ('no' + (fallo ? ': ' + fallo : ''));
    },
    escribir(ap1, ap2, nombre) {
      const ins = [...document.querySelectorAll('#filToogle input[type=text].ui-inputtext')].filter(x => !/_filter$|_focus$/.test(x.id));
      [ap1, ap2, nombre].forEach((v, i) => { if (ins[i]) { ins[i].value = v || ''; ins[i].dispatchEvent(new Event('change', { bubbles: true })); } });
      return ins.length;
    },
    verificado() { return !!window.turnstileToken; },
    elegirRango(p) {
      const s = [...document.querySelectorAll('select')].find(x => [...x.options].some(o => /^\d+\s*-\s*\d+$/.test(o.text.trim())));
      if (!s) return 'sin-rango';
      const o = [...s.options].find(o => { const m = o.text.trim().match(/^(\d+)\s*-\s*(\d+)$/); return m && p >= +m[1] && p <= +m[2]; });
      if (!o) return 'fuera';
      if (s.value === o.value) return 'ya';
      const w = wOf(s);
      try { if (w && w.selectValue) w.selectValue(o.value); else { s.value = o.value; jQuery(s).trigger('change'); } } catch (e) { return 'no: ' + e.message; }
      return 'ok';
    },
    rangos() {
      const s = [...document.querySelectorAll('select')].find(x => [...x.options].some(o => /^\d+\s*-\s*\d+$/.test(o.text.trim())));
      if (!s) return [];
      return [...s.options].map(o => o.text.trim().match(/^(\d+)\s*-\s*(\d+)$/)).filter(Boolean).map(m => [+m[1], +m[2]]);
    },
    marcar() { document.querySelectorAll('table').forEach(t => t.setAttribute('data-mb-viejo', '1')); return true; },
    enviar() { const b = document.getElementById('filToogle:formDynamicFilters:obtenerListado'); if (!b) return false; b.click(); return true; },
    leer() {
      const zona = document.getElementById('formData') || document;
      const tabla = [...zona.querySelectorAll('table')].find(t => !t.hasAttribute('data-mb-viejo') && t.querySelectorAll('tbody tr').length > 0);
      const visibles = sel => [...document.querySelectorAll(sel)].filter(e => e.offsetParent !== null).map(e => e.innerText.trim()).filter(Boolean).join(' ');
      const err = visibles('.ui-messages-error, .ui-message-error, .ui-growl-message');
      const captcha = visibles('#messageErrorCaptchaOffline');
      if (!tabla) return { filas: null, error: err, captcha };
      const cab = [...tabla.querySelectorAll('thead th, tr:first-child th')].map(th => norm(th.innerText));
      const col = re => cab.findIndex(h => re.test(h));
      const ix = { pos: col(/^(LLOC|PUESTO|ORDEN|N)/), nom: col(/^NOM/), sit: col(/SITUA/), per: col(/PERFIL/), cat: col(/CATEG/), dep: col(/DEPART/) };
      // En móvil la GVA mete el título de la columna dentro de cada celda («Puesto 123»): se quita
      const celda = td => { const c = td.cloneNode(true); c.querySelectorAll('.ui-column-title').forEach(e => e.remove()); return (c.textContent || '').replace(/\s+/g, ' ').trim()
        .replace(/^(Lloc|Puesto|Nombre|Nom|Situaci[oó]n?|Perfiles|Perfils|Perfil|Categor[ií]a|Departamento|Departament)\s*:?\s*/i, ''); };
      const filas = [...tabla.querySelectorAll('tbody tr')].map(tr => [...tr.querySelectorAll('td')].map(celda))
        .filter(c => c.length > 1).map(c => ({
          pos: parseInt(((c[ix.pos >= 0 ? ix.pos : 0] || '').match(/\d+/) || [])[0], 10), nom: norm(c[ix.nom >= 0 ? ix.nom : 1]),
          sit: norm(c[ix.sit >= 0 ? ix.sit : 2]), per: ix.per >= 0 ? c[ix.per] : '', cat: ix.cat >= 0 ? c[ix.cat] : '', dep: ix.dep >= 0 ? c[ix.dep] : ''
        }));
      const rango = [...document.querySelectorAll('select')].find(s => [...s.options].some(o => /^\d+\s*-\s*\d+$/.test(o.text.trim())));
      return { filas, cab, error: err, tramo: rango ? rango.options[rango.selectedIndex].text.trim() : '' };
    }
  };
  return true;
}

// Cada orden se ejecuta en la página de la GVA: si la página ha cambiado (navegación) se
// vuelven a poner las funciones, y si algo falla se apunta el error en el registro.
async function ev(expr) {
  const js = '(function(){try{if(!window.__mb){(' + paginaGVA.toString() + ')()}return (' + expr + ');}' +
    'catch(e){return {__err: String((e && e.message) || e)}}})()';
  let r;
  try { r = await NAV.ejecutar({ js }); } catch (e) { paso('Error del navegador: ' + (e.message || e)); return null; }
  let v = null;
  try { v = JSON.parse(r && r.valor); } catch (e) { v = null; }
  if (v && v.__err) { paso('Error en la página: ' + v.__err + ' [' + expr.slice(0, 40) + ']'); return null; }
  return v;
}
async function esperar(expr, ms, paso = 300) {
  const fin = Date.now() + ms;
  while (Date.now() < fin) { if (await ev(expr)) return true; await sleep(paso); }
  return false;
}
async function prepararPagina() {
  await ev('(' + paginaGVA.toString() + ')()');
}

// Registro de la última búsqueda (pasos y segundos), para ver dónde se atasca
let registro = [], t0 = 0;
function paso(msg) {
  if (registro.length && registro[registro.length - 1].endsWith(' · ' + msg)) return; // sin repetir
  const s = ((Date.now() - t0) / 1000).toFixed(1);
  registro.push(s + ' s · ' + msg);
  document.getElementById('ovS').textContent = msg;
}

// Espera a que Cloudflare dé el visto bueno. Si no llega solo en 3 s, se enseña la página de la
// GVA para que la persona toque la casilla (nunca se intenta saltar ni resolver por ella).
let verVisible = false;
async function verificacion(etiqueta) {
  if (await esperar('window.__mb.verificado()', 3000)) { paso('Verificación superada sola'); return true; }
  paso('Cloudflare pide verificación: se enseña la casilla');
  let cerrado = false;
  const h = await NAV.addListener('cerrado', () => { cerrado = true; });
  await ev('(function(){var t=document.getElementById("turnstileTarget");if(t)t.scrollIntoView({block:"center"});return true})()');
  if (!verVisible) await NAV.mostrar({ titulo: t('toca') });
  ovOff();
  const fin = Date.now() + 120000;
  let ok = false;
  while (Date.now() < fin && !cerrado) { if (await ev('window.__mb.verificado()')) { ok = true; break; } await sleep(400); }
  if (!verVisible) await NAV.ocultar();
  h.remove();
  ov(t('act'), etiqueta);
  paso(ok ? 'Verificación superada tocando la casilla' : (cerrado ? 'Verificación cerrada sin completar' : 'Verificación: tiempo agotado'));
  return ok;
}

async function esperarTabla(segundos) {
  const fin = Date.now() + segundos * 1000;
  let res = null;
  await sleep(500);
  while (Date.now() < fin) {
    await sleep(500);
    if (!await ev('window.__mb.listo()')) continue;
    res = await ev('window.__mb.leer()');
    if (res && (res.filas || res.error)) break;
    if (res && res.captcha) break;
  }
  return res;
}

// Recuentos de una lista (solo números: nunca se guardan nombres de otras personas)
function contar(filas) {
  const c = { activos: 0, desactivados: 0, noDisp: 0, disponibles: 0, total: 0 };
  for (const f of filas) {
    c.total++;
    if (/DESACTIV/.test(f.sit)) c.desactivados++;
    else if (/NO DISPONIBLE/.test(f.sit)) c.noDisp++;
    else if (/ACTI/.test(f.sit)) c.activos++;
    else if (/DISPONIBLE/.test(f.sit)) c.disponibles++;
  }
  return c;
}
const sumar = (a, b) => ({ activos: a.activos + b.activos, desactivados: a.desactivados + b.desactivados, noDisp: a.noDisp + b.noDisp, disponibles: a.disponibles + b.disponibles, total: a.total + b.total });
const inicioTramo = tx => { const m = (tx || '').match(/^(\d+)/); return m ? +m[1] : 1; };

// Cambia de tramo (1-200, 201-400…) y espera la tabla nueva; si la GVA pide verificación, se enseña
async function irATramo(n, etiqueta) {
  const r = await ev('window.__mb.elegirRango(' + n + ')');
  if (r === 'ya') return await ev('window.__mb.leer()');
  if (r !== 'ok') { paso('Tramo ' + n + ': ' + r); return null; }
  await ev('window.__mb.marcar()');
  let res = await esperarTabla(15);
  if (!(res && res.filas) && await verificacion(etiqueta)) {
    await ev('window.__mb.marcar()');
    await ev('window.__mb.elegirRango(' + n + ')');
    res = await esperarTabla(20);
  }
  return res && res.filas ? res : null;
}

// conNombre: filtra por tu nombre (para saber tu puesto). puesto: si se sabe, se pide la lista
// completa, se salta a tu tramo y se cuentan también los tramos anteriores (todos los de delante).
async function consultarDep(url, b, dep, etiqueta, conNombre = true, puesto = null) {
  ov(t('act'), etiqueta);
  paso(etiqueta + ': abriendo la consulta');
  await NAV.abrir({ url });
  await prepararPagina();
  if (!await esperar('window.__mb.listo()', 20000)) throw new Error('La página de la GVA no ha cargado');
  for (const [n, v] of [[0, b.cat], [1, b.turno], [2, dep]]) {
    const r = await ev('window.__mb.elegir(' + n + ',' + JSON.stringify(v) + ')');
    if (r !== 'ok') throw new Error('No se pudo elegir ' + ['la categoría', 'el turno', 'el departamento'][n] + ' (' + r + ')');
    await esperar('window.__mb.listo()', 10000, 200);
  }
  const nom = conNombre ? [perfil.ap1, perfil.ap2, perfil.nombre] : ['', '', ''];
  await ev('window.__mb.escribir(' + nom.map(x => JSON.stringify(x || '')).join(',') + ')');
  paso(conNombre ? 'Formulario rellenado (con tu nombre)' : 'Formulario rellenado (lista completa)');
  if (!await verificacion(etiqueta)) throw new Error('No se completó la verificación de Cloudflare');
  await ev('window.__mb.marcar()');
  await ev('window.__mb.enviar()');
  paso('Consulta enviada a la GVA');
  let res = await esperarTabla(40);
  if (res && !res.filas && res.captcha) paso('La GVA no aceptó la verificación');
  if (!res || !res.filas) throw new Error(res && (res.error || res.captcha) ? (res.error || res.captcha) : 'La GVA no ha devuelto la lista');
  paso('Lista recibida: ' + res.filas.length + ' filas' + (res.tramo ? ' (tramo ' + res.tramo + ')' : '') + ' · columnas: ' + (res.cab || []).join(', '));
  if (!puesto) return res;

  // Recuentos ya vistos por tramo (el primero que devuelve la GVA suele ser 1-200)
  const vistos = {};
  if (res.tramo) vistos[inicioTramo(res.tramo)] = contar(res.filas);
  const rangos = (await ev('window.__mb.rangos()')) || [];
  const mio = rangos.find(r => puesto >= r[0] && puesto <= r[1]);
  if (mio && inicioTramo(res.tramo) !== mio[0]) {
    paso('Saltando a tu tramo ' + mio[0] + '-' + mio[1]);
    const r2 = await irATramo(mio[0], etiqueta);
    if (!r2) { paso('No se pudo cambiar de tramo'); res.parcial = true; return res; }
    res = r2;
  }
  // Tramos anteriores al tuyo: toda esa gente también está delante
  let antes = { activos: 0, desactivados: 0, noDisp: 0, disponibles: 0, total: 0 }, completos = true;
  const previos = rangos.filter(r => mio && r[1] < mio[0]);
  for (const r of previos) {
    if (!vistos[r[0]]) {
      paso('Contando el tramo ' + r[0] + '-' + r[1]);
      const rr = await irATramo(r[0], etiqueta);
      if (!rr) { completos = false; break; }
      vistos[r[0]] = contar(rr.filas);
    }
    antes = sumar(antes, vistos[r[0]]);
  }
  res.antes = completos ? antes : null;
  res.tramos = previos.length && completos ? '1-' + mio[1] : '';
  return res;
}

// De la lista solo se guarda TU fila y recuentos: nunca nombres de otras personas
function resumir(res, b, puestoSabido = null) {
  const pal = x => (x || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9Ñ ]+/g, ' ').split(/\s+/).filter(Boolean);
  const mias = pal([perfil.ap1, perfil.ap2, perfil.nombre].join(' '));
  const esYo = f => !mias.length || mias.every(w => pal(f.nom).includes(w));
  const p = b.puesto || puestoSabido;
  let mia = null;
  if (p) mia = res.filas.find(f => f.pos === p && esYo(f)) || null;
  if (!mia && mias.length) mia = res.filas.find(f => mias.every(w => pal(f.nom).includes(w))) || null;
  let delante = mia ? contar(res.filas.filter(f => f.pos < mia.pos)) : contar(res.filas);
  let alcance = 'tramo';
  if (mia && res.antes) { delante = sumar(delante, res.antes); alcance = 'todo'; }
  if (mia && inicioTramo(res.tramo) === 1 && !res.parcial) alcance = 'todo';
  return {
    identificado: !!(p || mias.length), encontrado: !!mia, puesto: mia ? mia.pos : null, situacion: mia ? mia.sit : '', perfil: mia ? mia.per : '',
    trabaja: mia && mia.dep ? [mia.cat, mia.dep].filter(Boolean).join(' · ') : '', tramo: res.tramo, alcance, tramos: res.tramos || '', delante
  };
}

// Una bolsa y un departamento: primero tu puesto (si hace falta), luego la lista completa
async function consultarBolsa(lista, b, dep, etiqueta) {
  const prev = datos[clave(b, dep)];
  const conNombre = conNombreP();
  let sabido = b.puesto || (prev && prev.encontrado && prev.puesto) || null;
  let rA = null;
  if (conNombre && !sabido) {
    rA = resumir(await consultarDep(lista.url, b, dep, etiqueta, true), b);
    sabido = rA.puesto;
    paso(sabido ? 'Tu puesto: ' + sabido : 'No apareces con ese nombre');
  }
  let r = rA;
  if (sabido || !conNombre) {
    const rB = resumir(await consultarDep(lista.url, b, dep, etiqueta, false, sabido), b, sabido);
    if (rB.encontrado || !conNombre) r = rB;
    else if (!rA) { r = rA = resumir(await consultarDep(lista.url, b, dep, etiqueta, true), b); }
  }
  if (r === rA && r && r.encontrado) r.delante = null; // con el filtro de nombre no se puede contar
  return r;
}

let actualizando = false;
async function actualizar() {
  if (actualizando || !perfil) return;
  if (!NAV) { demo(); return; }
  actualizando = true;
  registro = []; t0 = Date.now();
  const errores = [], novedades = [];
  const tareas = [];
  perfil.bolsas.forEach(b => b.deps.forEach(d => tareas.push([b, d])));
  try {
    ov(t('act'), '', 0.03);
    paso('Buscando la última publicación');
    await NAV.abrir({ url: INDEX_URL });
    if (verVisible) await NAV.mostrar({ titulo: t('webGva') });
    await prepararPagina();
    await esperar('!!window.__mb.lista()', 15000);
    const lista = await ev('window.__mb.lista()');
    if (!lista) throw new Error('No encuentro la consulta de situación en la web de la GVA');
    paso('Publicación: ' + lista.texto.replace(/^.*\((\d+\/\d+\/\d+)\).*$/, '$1'));
    const ultima = store.get('ultimaPub', null);
    if (ultima && ultima !== lista.texto) novedades.push(t('nuevaPub', fechaTxt(lista.texto)));
    for (let i = 0; i < tareas.length; i++) {
      const [b, dep] = tareas[i];
      const etiqueta = depName(dep) + (perfil.bolsas.length > 1 ? ' · ' + catCorta(b.cat) : '');
      progreso((i + 0.2) / tareas.length, t('paso', i + 1, tareas.length) + ' · ' + etiqueta);
      try {
        const k = clave(b, dep), prev = datos[k];
        const r = await consultarBolsa(lista, b, dep, etiqueta);
        novedades.push(...cambios(depName(dep), prev, r));
        datos[k] = Object.assign(r, { fecha: Date.now(), pub: lista.texto, hist: sumarHist(prev && prev.hist, r, lista.texto), prev: prev && prev.delante ? prev.delante : null });
      } catch (e) { errores.push(etiqueta + ': ' + e.message); paso('ERROR ' + etiqueta + ': ' + e.message); }
    }
    store.set('datos', datos);
    store.set('ultimaPub', lista.texto);
    store.set('comprobado', Date.now());
    if (novedades.length) store.set('novedades', { fecha: Date.now(), items: novedades });
  } catch (e) { errores.push(e.message); paso('ERROR: ' + e.message); }
  finally {
    paso('Fin');
    try { await NAV.cerrar(); } catch (e) {}
    actualizando = false; ovOff();
    store.set('errores', errores);
    store.set('registro', registro);
    pintar();
    actualizarWidget();
  }
}

// Al abrir la app: mira (sin consultar listas) si la GVA ha sacado una publicación nueva
async function comprobarPublicacion() {
  if (!NAV || actualizando || !perfil) return;
  if (Date.now() - store.get('comprobado', 0) < 3600e3) return;   // como mucho una vez por hora
  try {
    await NAV.abrir({ url: INDEX_URL });

}

const $app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// «ENFERMERA/O SAMU» → «Enfermera/o SAMU»: siglas en mayúsculas, el resto en minúscula con inicial
const SIGLAS = new Set(['SAMU', 'SES', 'GVA', 'AP', 'EAP', 'E.A.P.', 'C.I.C.U.', 'S.P.', 'P.', 'T.E.', 'F.', 'ESP.', 'M-Q', 'UCI', 'S.', 'C.TRANS.', 'TCAE']);
const MENUDAS = new Set(['de', 'del', 'y', 'en', 'la', 'el', 'los', 'las', 'a', 'o', 'e', 'para', 'por']);
const cap = s => (s || '').split(' ').map((w, i) => {
  if (SIGLAS.has(w) || /\d/.test(w)) return w;
  const l = w.toLowerCase();
  if (i > 0 && MENUDAS.has(l)) return l;
  if (/^d'./.test(l)) return "d'" + l.charAt(2).toUpperCase() + l.slice(3);
  return l.charAt(0).toUpperCase() + l.slice(1);
}).join(' ');
const catCorta = c => cap(catName(c));
const sitCorta = s => cap((s || '').replace(/^SITUACION\s*/, ''));
const fechaTxt = tx => { const m = (tx || '').match(/(\d{1,2}\/\d{1,2}\/\d{4})/); return m ? m[1] : ''; };
function ov(tt, s, frac) {
  document.getElementById('ovT').textContent = tt; document.getElementById('ovS').textContent = s || '';
  if (typeof frac === 'number') progreso(frac);
  document.getElementById('overlay').style.display = 'flex';
}
function progreso(frac, s) {
  document.getElementById('ovP').style.width = Math.max(5, Math.min(100, frac * 100)) + '%';
  if (s) document.getElementById('ovT').textContent = s;
}
function ovOff() { document.getElementById('overlay').style.display = 'none'; }
const norm2 = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

// Hoja inferior con buscador (categorías y departamentos)
function hoja(titulo, grupos, actual, alElegir) {
  const H = document.getElementById('hoja'), Q = document.getElementById('hojaQ'), L = document.getElementById('hojaL');
  document.getElementById('hojaT').textContent = titulo;

      html += '<div class="sub">' + esc(g.t) + '</div>' + ops.map(o => `<button class="op${o[0] === actual ? ' sel' : ''}" data-v="${o[0]}">${esc(cap(o[1]))}</button>`).join('');
    }
    L.innerHTML = html || '<div class="note" style="padding:12px 6px">' + t('sinRes') + '</div>';
  };

  L.onclick = e => { const b = e.target.closest('.op'); if (b) { cerrar(); alElegir(b.dataset.v); } };

// ───────────────────────── Evolución, estimación y novedades ─────────────────────────
function fechaPub(tx) { const m = (tx || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? new Date(+m[3], m[2] - 1, +m[1]).getTime() : null; }

// Un punto por publicación (si se actualiza varias veces la misma, se sustituye el último)
function sumarHist(h, r, pub) {
  h = (h || []).slice();
  if (!r.encontrado || !r.delante) return h;
  const pt = { f: Date.now(), fp: fechaPub(pub) || Date.now(), pub, puesto: r.puesto, sit: r.situacion, alc: r.alcance,
    act: r.delante.activos, des: r.delante.desactivados, nd: r.delante.noDisp, disp: r.delante.disponibles };
  if (h.length && h[h.length - 1].pub === pub) h[h.length - 1] = pt; else h.push(pt);
  return h.slice(-60);
}

function cambios(nom, prev, r) {
  const out = [];
  if (!prev || !prev.encontrado || !r.encontrado) return out;
  if (prev.situacion && r.situacion && prev.situacion !== r.situacion) out.push(t('cambioSit', nom, sitCorta(prev.situacion), sitCorta(r.situacion)));
  if (prev.puesto && r.puesto && prev.puesto !== r.puesto) out.push(t('cambioPuesto', nom, prev.puesto, r.puesto));
  if (prev.delante && r.delante && prev.alcance === r.alcance) {
    const x = prev.delante.disponibles - r.delante.disponibles;
    if (x > 0) out.push(t('menosDisp', nom, x));
    if (x < 0) out.push(t('masDisp', nom, -x));
    const a = r.delante.activos - prev.delante.activos;
    if (a > 0) out.push(t('empiezan', nom, a));
  }
  return out;
}

function grafica(h) {
  const pts = (h || []).filter(p => typeof p.disp === 'number');
  if (pts.length < 2) return '<div class="note">' + t('grafFalta') + '</div>';
  const W = 300, H = 76, max = Math.max(1, ...pts.map(p => p.disp)), n = pts.length;
  const xy = pts.map((p, i) => [8 + i * (W - 16) / (n - 1), 8 + (H - 16) * (1 - p.disp / max)]);
  const linea = xy.map(c => c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const area = '8,' + H + ' ' + linea + ' ' + (W - 8) + ',' + H;
  const f = x => new Date(x).toLocaleDateString(lang === 'va' ? 'ca-ES' : 'es-ES', { day: 'numeric', month: 'short' });
  return `<div class="graf"><div class="note" style="margin:0 0 6px">${t('grafT')}</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="${t('grafT')}">
      <defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".28"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>
      <polygon points="${area}" fill="url(#gA)"/>
      <polyline points="${linea}" fill="none" stroke="var(--acc)" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
      ${xy.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.2" fill="var(--acc)"/>`).join('')}
    </svg>
    <div class="ej"><span>${f(pts[0].fp)} · ${pts[0].disp}</span><span>${f(pts[n - 1].fp)} · ${pts[n - 1].disp}</span></div></div>`;
}

// Aproximación: cuánto bajan los disponibles de delante al mes y cuánto falta
function estimacion(h, dl) {
  if (!dl) return '';
  if (dl.disponibles === 0) return '<div class="est">' + t('nadie') + '</div>';
  const pts = (h || []).filter(p => typeof p.disp === 'number');
  if (pts.length < 2) return '<div class="note">' + t('masPub') + '</div>';
  const a = pts[0], b = pts[pts.length - 1], dias = (b.fp - a.fp) / 86400000;
  if (dias < 7) return '<div class="note">' + t('masSem') + '</div>';
  const baja = a.disp - b.disp;
  if (baja <= 0) return '<div class="note">' + t('noBaja', Math.round(dias / 7)) + '</div>';
  const porMes = baja / dias * 30, falta = dl.disponibles / (baja / dias);
  const cuanto = falta < 14 ? t('dias', Math.max(1, Math.round(falta))) : falta < 60 ? t('semanas', Math.round(falta / 7)) : t('meses', Math.round(falta / 30));
  return '<div class="est">' + t('estim', porMes < 1 ? porMes.toFixed(1) : Math.round(porMes), cuanto) + '</div>';
}

  const k = clave(b, dep), d = datos[k];
  const cab = `<div class="kicker">${esc(catCorta(b.cat))} · ${turnoTxt(b.turno)}</div><div class="dep">${esc(cap(depName(dep)))}</div>`;
  if (!d) return `<div class="card res">${cab}<div class="note">${t('sinConsultar')}</div></div>`;
  if (!d.encontrado) {
    const aviso = d.identificado ? '<div class="err">' + t('noEncuentro') + '</div>' : '<div class="note">' + t('resumen', d.tramo ? ' (' + esc(d.tramo) + ')' : '') + '</div>';
    return `<div class="card res">${cab}${aviso}${cifras(d.delante, false)}</div>`;
  }
  const dl = d.delante, prev = d.prev;
  let delta = '';
  if (dl && prev && typeof prev.activos === 'number') {
    const x = dl.activos - prev.activos;
    delta = x > 0 ? `<div class="delta up">${t('deltaUp', x, x > 1 ? t('empezadoN') : t('empezado1'))}</div>`
      : x < 0 ? `<div class="delta">${t('deltaDown', -x, -x > 1 ? t('dejadoN') : t('dejado1'))}</div>` : `<div class="delta">${t('sinCambios')}</div>`;
  }
  const alc = dl && d.alcance === 'tramo' && d.tramo ? `<div class="note">${t('tramoSolo', esc(d.tramo))}</div>`
    : dl && d.tramos ? `<div class="note">${t('todosDelante', esc(d.tramos))}</div>` : '';
  return `<div class="card res">
    <div class="top"><div style="min-width:0">${cab}${tagSit(d.situacion)}</div>
      <div class="badge"><span>${t('tuPuesto')}</span><b>${d.puesto}</b></div></div>
    ${d.perfil ? `<div class="perf">${t('perfiles')}: <b>${esc(d.perfil)}</b></div>` : ''}
    ${d.trabaja ? `<div class="perf">${t('trabajaEn')}: <b>${esc(d.trabaja)}</b></div>` : ''}
    ${cifras(dl, true)}${delta}${alc}${estimacion(d.hist, dl)}${grafica(d.hist)}
    <div class="acciones"><button class="sec" data-share="${esc(k)}">↗︎ ${t('compartir')}</button></div>
  </div>`;
}

// ───────────────────────── Compartir «Mi situación» (imagen con tus datos) ─────────────────────────
function imagenSituacion(b, dep) {
  const d = datos[clave(b, dep)];
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1080;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 1080, 1080); gr.addColorStop(0, '#14b8a6'); gr.addColorStop(1, '#3b82f6');
  g.fillStyle = gr; g.fillRect(0, 0, 1080, 1080);
  const R = (x, y, w, h, r, col) => { g.fillStyle = col; g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); g.fill(); };
  R(70, 70, 940, 940, 56, '#ffffff');
  const F = (s, w) => { g.font = w + ' ' + s + 'px -apple-system, "Segoe UI", Roboto, sans-serif'; };
  g.fillStyle = '#64748b'; F(36, '600'); g.fillText(catCorta(b.cat) + ' · ' + turnoTxt(b.turno), 130, 175);
  g.fillStyle = '#1e293b'; F(64, '800'); g.fillText(cap(depName(dep)), 130, 255);
  R(130, 300, 820, 210, 40, '#eef2f8');
  g.fillStyle = '#64748b'; F(34, '600'); g.fillText(t('tuPuesto'), 170, 365);
  g.fillStyle = '#0f766e'; F(120, '800'); g.fillText('#' + d.puesto, 170, 480);
  g.fillStyle = '#1e293b'; F(38, '700'); g.textAlign = 'right'; g.fillText(sitCorta(d.situacion), 910, 365); g.textAlign = 'left';
  if (d.delante) {
    const it = [[d.delante.disponibles, t('disp'), '#e0eaff', '#1d4ed8'], [d.delante.activos, t('activos'), '#eef2f8', '#1e293b'], [d.delante.desactivados, t('desact'), '#eef2f8', '#1e293b'], [d.delante.noDisp, t('noDisp'), '#eef2f8', '#1e293b']];
    g.fillStyle = '#64748b'; F(32, '600'); g.fillText(t('delante'), 130, 580);
    it.forEach((x, i) => {
      const X = 130 + (i % 2) * 420, Y = 610 + Math.floor(i / 2) * 170;
      R(X, Y, 400, 150, 32, x[2]);
      g.fillStyle = x[3]; F(72, '800'); g.fillText(String(x[0]), X + 34, Y + 85);
      g.fillStyle = '#64748b'; F(30, '600'); g.fillText(x[1], X + 34, Y + 128);
    });
  }
  g.fillStyle = '#94a3b8'; F(26, '500'); g.fillText('Mi Bolsa · ' + (lang === 'va' ? 'app no oficial' : 'app no oficial') + ' · ' + fechaTxt(d.pub), 130, 975);
  return c.toDataURL('image/png');
}
async function compartir(k) {
  const [cat, turno, dep] = k.split('|');
  const b = perfil.bolsas.find(x => x.cat === cat && x.turno === turno);
  if (!b || !datos[k] || !datos[k].encontrado) return;
  const img = imagenSituacion(b, dep);
  try {
    if (NAV && NAV.compartir) await NAV.compartir({ imagen: img, texto: t('compTexto') });
    else { const a = document.createElement('a'); a.href = img; a.download = 'mi-bolsa.png'; a.click(); }
  } catch (e) {}
}

// ───────────────────────── Pantalla principal ─────────────────────────
function pie() {
  return `<footer>${t('pie1')}<br>${t('pie2')}</footer>`;
}

function pintar() {
  document.getElementById('hSub').textContent = t('sub');
  document.getElementById('bLang').textContent = lang === 'es' ? 'VAL' : 'CAS';
  document.documentElement.lang = lang === 'va' ? 'ca' : 'es';
  if (!perfil) return pantallaPerfil();
  $app.onclick = null;
  const fechas = [];
  perfil.bolsas.forEach(b => b.deps.forEach(d => { const x = datos[clave(b, d)]; if (x && x.fecha) fechas.push(x.fecha); }));
  const cuando = fechas.length ? new Date(Math.min(...fechas)).toLocaleString(lang === 'va' ? 'ca-ES' : 'es-ES', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }) : t('nunca');
  const errores = store.get('errores', []);
  const reg = store.get('registro', []);
  const pub = store.get('ultimaPub', '') || (Object.values(datos).find(x => x && x.pub) || {}).pub || '';
  const varias = perfil.bolsas.length > 1;
  $app.innerHTML = `
    <div class="bar"><span class="when">${t('actualizado')}: ${esc(cuando)}</span>
      <span><button class="sec" id="bAct">↻ ${t('bAct')}</button> <button class="sec" id="bEdit">${t('bEdit')}</button></span></div>
    ${errores.length ? '<div class="err">' + errores.map(esc).join('<br>') + '</div><br>' : ''}
    ${avisos()}
    ${perfil.bolsas.map(b => (varias ? `<div class="grupo">${esc(catCorta(b.cat))} · ${turnoTxt(b.turno)}</div>` : '') + b.deps.map(d => tarjeta(b, d)).join('')).join('')}
    ${pub ? '<div class="note" style="padding:0 6px">' + t('pubT') + ': ' + esc(fechaTxt(pub) || pub) + '</div>' : ''}
    ${reg.length ? `<details class="card reg" style="margin-top:16px"><summary>${t('detalles')}</summary><pre>${reg.map(esc).join('\n')}</pre></details>` : ''}
    ${pie()}`;
  document.getElementById('bAct').onclick = actualizar;
  document.getElementById('bEdit').onclick = pantallaPerfil;
  const bn = document.getElementById('bNov');
  if (bn) bn.onclick = () => { store.set('novedades', null); pintar(); };
  $app.querySelectorAll('[data-share]').forEach(x => { x.onclick = () => compartir(x.dataset.share); });
}

document.getElementById('bLang').onclick = () => {
  lang = lang === 'es' ? 'va' : 'es'; store.set('lang', lang);
  if (document.getElementById('fOk')) pantallaPerfil(); else pintar();
};

verVisible = store.get('ver', false);
pintar();
// Al abrir la app (y al volver a ella): si los datos tienen más de 6 horas se actualiza;
// si no, se mira si la GVA ha sacado una publicación nueva y entonces se actualiza.
const viejo = () => perfil && perfil.bolsas.some(b => b.deps.some(d => { const x = datos[clave(b, d)]; return !x || Date.now() - x.fecha > 6 * 3600e3; }));
const alAbrir = () => { if (viejo()) actualizar(); else comprobarPublicacion(); };
alAbrir();
document.addEventListener('visibilitychange', () => { if (!document.hidden) alAbrir(); });
</script>
