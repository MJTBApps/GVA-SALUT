<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Mi Bolsa Salut</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1e293b; --muted:#64748b; --line:#e5e9f2; --soft:#eef2f8;
  --acc:#0d9488; --acc-ink:#0f766e; --acc2:#d5f5ef; --hero1:#14b8a6; --hero2:#3b82f6;
  --warn:#b45309; --warn2:#fff3d6; --red:#be123c; --red2:#ffe4ea; --blue:#1d4ed8; --blue2:#e0eaff;
  --green:#15803d; --green2:#dcfce7; --shadow:0 6px 24px rgba(30,41,59,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0b1220; --card:#131c2e; --ink:#e7edf7; --muted:#93a1b8; --line:#24314a; --soft:#1a2539;
    --acc:#2dd4bf; --acc-ink:#5eead4; --acc2:#123c3a; --hero1:#0f766e; --hero2:#1e40af;
    --warn:#fbbf24; --warn2:#3a2c0d; --red:#fb7185; --red2:#3b1220; --blue:#93b4ff; --blue2:#16264a;
    --green:#4ade80; --green2:#0f2f1d; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{color-scheme:dark;
    --bg:#0b1220; --card:#131c2e; --ink:#e7edf7; --muted:#93a1b8; --line:#24314a; --soft:#1a2539;
    --acc:#2dd4bf; --acc-ink:#5eead4; --acc2:#123c3a; --hero1:#0f766e; --hero2:#1e40af;
    --warn:#fbbf24; --warn2:#3a2c0d; --red:#fb7185; --red2:#3b1220; --blue:#93b4ff; --blue2:#16264a;
    --green:#4ade80; --green2:#0f2f1d; --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 20px 22px;border-radius:0 0 28px 28px}
header .fila{display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{margin:0;font-size:26px;letter-spacing:-.02em}
header .marca{display:flex;align-items:center;gap:12px;min-width:0}
header .logo{width:52px;height:52px;border-radius:14px;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.18),0 0 0 2px rgba(255,255,255,.55)}
header p{margin:4px 0 0;color:rgba(255,255,255,.85);font-size:14px}
.lang{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:6px 12px;font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{padding:18px 16px;max-width:640px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom) + 96px)}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;display:none;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
#tabs .in{max-width:640px;margin:0 auto;display:flex}
#tabs button{flex:1;border:0;background:none;color:var(--muted);font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
#tabs button span{font-size:22px;line-height:1.1;filter:grayscale(1);opacity:.7}
#tabs button.on{color:var(--acc-ink)}#tabs button.on span{filter:none;opacity:1}
.res.off{opacity:.78}
.nf{background:var(--warn2);color:var(--warn);border-radius:16px;padding:14px;margin-top:12px;font-size:15px}.nf b{display:block;font-size:17px;margin-bottom:4px}
.ajuste{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;color:var(--ink);font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:15px 2px;border-top:1px solid var(--line);cursor:pointer;text-align:left}
.ajuste:first-of-type{border-top:0}.ajuste i{font-style:normal;color:var(--muted)}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
h2{font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 8px}
label.l{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:16px 0 6px}
input{width:100%;font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);outline:none}
input:focus{border-color:var(--acc)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.picker{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer}
.picker span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.picker i{font-style:normal;color:var(--muted)}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;border-radius:11px;padding:10px;font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:0;border-radius:999px;padding:8px 12px;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--acc2);color:var(--acc-ink);cursor:pointer}
.chip.add{background:var(--soft);color:var(--ink)}
button.main{width:100%;border:0;border-radius:16px;padding:16px;font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--acc);color:#fff;margin-top:18px;cursor:pointer}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.main{color:#06201d}}
:root[data-theme="dark"] button.main{color:#06201d}
button.sec{border:0;border-radius:999px;padding:9px 14px;background:var(--soft);font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);cursor:pointer}
button.link{border:0;background:none;color:var(--acc-ink);font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:8px 0;cursor:pointer}
.note{font-size:14px;color:var(--muted);margin-top:8px}
.actres{margin:10px 0 12px;font-size:15px;line-height:1.45}
.tt{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;align-items:center;font-size:14px}
.tt b{white-space:nowrap;font-size:12px;color:var(--muted);font-weight:600;text-align:right}
.tt i{font-style:normal;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.fts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ft{border-radius:16px;padding:12px 12px 12px 14px;border-left:4px solid}
.ft.fo{background:var(--acc2);border-color:var(--acc)}.ft.fp{background:var(--blue2);border-color:var(--blue)}
.ftt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.ftn{font-size:30px;font-weight:800;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.ft.fo .ftn{color:var(--acc-ink)}.ft.fp .ftn{color:var(--blue)}
.ftl{font-size:13px;color:var(--muted)}
.ftv{font-size:14px;margin-top:8px}.ftm{font-size:12px;color:var(--muted);margin-top:4px}
.depbox{border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}
.depbox .dt{font-weight:700;color:var(--acc-ink);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.depbox .dt span{font-weight:600;color:var(--muted);font-size:13px}
.mas{margin-top:6px}
.sect{font-size:17px;font-weight:800;color:var(--ink);margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.bolsa-ed{border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.bolsa-ed .cab{display:flex;justify-content:space-between;align-items:center}
.bolsa-ed .cab b{font-size:15px}
/* Tarjeta de resultados */
.res .kicker{font-size:13px;color:var(--muted);font-weight:600}
.res .dep{font-weight:800;font-size:21px;letter-spacing:-.01em;margin-top:2px}
.res .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.badge{min-width:86px;text-align:center;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:18px;padding:10px 12px}
.badge span{display:block;font-size:11px;opacity:.9;text-transform:uppercase;letter-spacing:.05em}
.badge b{display:block;font-size:30px;line-height:1.1}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;margin-top:10px}
.t-act{background:var(--green2);color:var(--green)}.t-des{background:var(--warn2);color:var(--warn)}
.t-no{background:var(--red2);color:var(--red)}.t-dis{background:var(--blue2);color:var(--blue)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.stat{background:var(--soft);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.1}.stat span{font-size:13px;color:var(--muted)}
.stat.hl{background:var(--blue2)}.stat.hl b{color:var(--blue)}
.delta{font-size:14px;margin-top:12px;color:var(--muted)}.delta.up{color:var(--green)}
.est{background:var(--acc2);color:var(--acc-ink);border-radius:16px;padding:12px 14px;font-size:15px;margin-top:12px}
.perf{font-size:14px;margin-top:10px;color:var(--muted)}.perf b{color:var(--ink)}
.graf{margin-top:16px}.graf svg{width:100%;height:90px;display:block}
.graf .ej{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.acciones{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.err{background:var(--red2);color:var(--red);border-radius:14px;padding:12px;font-size:15px;margin-top:10px}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.bar .when{font-size:14px;color:var(--muted)}.bar>span:last-child{display:flex;gap:8px;flex-shrink:0}
.badge span{white-space:nowrap;font-size:10px}
.nov{background:linear-gradient(135deg,var(--acc2),var(--blue2))}.nov ul{margin:0;padding-left:18px}.nov li{margin:5px 0;font-size:15px}
.grupo{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:22px 4px 8px}
.tabla{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}.tabla th{color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;font-size:12px}.tabla th:first-child,.tabla td:first-child{text-align:left}
.tabla td{padding:8px 4px;border-top:1px solid var(--line);text-align:right}.tabla tr.mejor td{color:var(--acc-ink);font-weight:700}
.barra{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:4px}.barra i{display:block;height:100%;background:var(--acc)}
.quin{padding:10px 0;border-top:1px solid var(--line)}.quin:first-of-type{border-top:0}.quin ul{margin:6px 0 0;padding-left:4px;list-style:none}.quin li{font-size:14px;margin-top:4px}
.rng{margin-top:14px}.rng label{display:block;font-size:14px;margin-bottom:4px}.rng input{width:100%;accent-color:var(--acc)}
.mini{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-top:10px}
.enl{display:block;padding:12px 0;border-top:1px solid var(--line);color:var(--acc-ink);text-decoration:none;font-weight:600}
.pred{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.pred div::first-letter{text-transform:uppercase}.pred div{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14px}.pred b{display:block;font-size:17px}
.total{font-size:44px;font-weight:800;color:var(--acc-ink);line-height:1}
.inl{display:flex;align-items:center;gap:10px;margin-top:10px}.inl label{flex:1;font-size:14px;color:var(--ink)}.inl input,.inl select{width:96px;flex:0 0 96px}
select{font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
.reg summary{font-weight:600;cursor:pointer;color:var(--muted);font-size:15px}.reg pre{white-space:pre-wrap;font-size:12px;color:var(--muted);margin:10px 0 0}
.check{display:flex;gap:10px;align-items:center;font-size:15px;margin-top:16px;color:var(--muted)}.check input{width:auto}
.guia{counter-reset:p;padding:0;margin:10px 0 0;list-style:none}
.guia li{counter-increment:p;display:flex;gap:10px;margin:10px 0;font-size:15px}
.guia li::before{content:counter(p);flex:0 0 26px;height:26px;border-radius:50%;background:var(--acc2);color:var(--acc-ink);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
footer{font-size:13px;color:var(--muted);text-align:center;margin-top:26px;line-height:1.5}
a{color:var(--acc-ink)}
/* Buscador de categorías y departamentos */
#hoja{position:fixed;inset:0;background:rgba(2,6,23,.45);display:none;z-index:30;align-items:flex-end;justify-content:center}
#hoja .h{background:var(--card);width:100%;max-width:640px;max-height:88vh;border-radius:26px 26px 0 0;display:flex;flex-direction:column;padding:14px 16px calc(env(safe-area-inset-bottom) + 10px)}
#hoja .tira{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
#hoja .hc{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#hoja .lista{overflow:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
#hoja .op{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer}
#hoja .op small{display:block;color:var(--muted);font-size:12px}
#hoja .op.sel{color:var(--acc-ink);font-weight:700}
#hoja .sub{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:12px 6px 4px}
/* Hoja de información (qué significa cada situación) */
#info{position:fixed;inset:0;background:rgba(2,6,23,.45);display:none;z-index:31;align-items:flex-end;justify-content:center}
#info .h{background:var(--card);width:100%;max-width:640px;max-height:85vh;border-radius:26px 26px 0 0;display:flex;flex-direction:column;padding:14px 18px calc(env(safe-area-inset-bottom) + 18px)}
#info .tira{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
#info .hc{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#info .lista{overflow:auto;font-size:16px}#info p{margin:8px 0}#info .note{font-size:13px}
.tag{cursor:pointer}.tag::after{content:" ⓘ";font-weight:600;opacity:.7}
/* Plazos */
.plazo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.plazo b{display:block;font-size:15px}.plazo span{font-size:13px;color:var(--muted)}
.plazo.pasado{opacity:.5}
/* Hueco del anuncio (banner): lo ocupa el anuncio nativo de AdMob cuando esté activado */
#anuncio{display:none;position:fixed;left:0;right:0;height:56px;z-index:9}
body.con-anuncio main{padding-bottom:calc(env(safe-area-inset-bottom) + 170px)}
/* Pantalla de búsqueda */
#overlay{position:fixed;inset:0;background:rgba(2,6,23,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
#overlay .box{background:var(--card);border-radius:26px;padding:26px 22px;max-width:360px;width:100%;text-align:center;box-shadow:var(--shadow)}
#overlay b{font-size:18px}
.lupa{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(135deg,var(--hero1),var(--hero2));display:flex;align-items:center;justify-content:center;animation:lat 1.4s ease-in-out infinite}
@keyframes lat{50%{transform:scale(1.08)}}
.prog{height:8px;background:var(--soft);border-radius:8px;margin-top:16px;overflow:hidden}
.prog i{display:block;height:100%;width:5%;background:linear-gradient(90deg,var(--hero1),var(--hero2));border-radius:8px;transition:width .4s}
.ovs{font-size:14px;color:var(--muted);margin-top:8px;min-height:20px}
</style>
</head>

    },
    escribir(ap1, ap2, nombre) {
      const ins = [...document.querySelectorAll('#filToogle input[type=text].ui-inputtext')].filter(x => !/_filter$|_focus$/.test(x.id));
      [ap1, ap2, nombre].forEach((v, i) => { if (ins[i]) { ins[i].value = v || ''; ins[i].dispatchEvent(new Event('change', { bubbles: true })); } });
      return ins.length;
    },
    verificado() { return !!window.turnstileToken; },
    elegirRango(p) {
      const s = [...document.querySelectorAll('select')].find(x => [...x.options].some(o => /^\d+\s*-\s*\d+$/.test(o.text.trim())));
      if (!s) return 'sin-rango';
      const o = [...s.options].find(o => { const m = o.text.trim().match(/^(\d+)\s*-\s*(\d+)$/); return m && p >= +m[1] && p <= +m[2]; });
      if (!o) return 'fuera';
      if (s.value === o.value) return 'ya';
      const w = wOf(s);
      try { if (w && w.selectValue) w.selectValue(o.value); else { s.value = o.value; jQuery(s).trigger('change'); } } catch (e) { return 'no: ' + e.message; }
      return 'ok';
    },
    rangos() {
      const s = [...document.querySelectorAll('select')].find(x => [...x.options].some(o => /^\d+\s*-\s*\d+$/.test(o.text.trim())));
      if (!s) return [];
      return [...s.options].map(o => o.text.trim().match(/^(\d+)\s*-\s*(\d+)$/)).filter(Boolean).map(m => [+m[1], +m[2]]);
    },
    // Consulta de nombramientos: meses disponibles (botones) y elegir uno
    meses() { return [...document.querySelectorAll('#filToogle .ui-selectonebutton .ui-button')].map((b, i) => ({ i, txt: b.innerText.trim(), sel: b.classList.contains('ui-state-active') })); },
    elegirMes(i) { const b = [...document.querySelectorAll('#filToogle .ui-selectonebutton .ui-button')][i]; if (!b) return 'sin-mes'; if (b.classList.contains('ui-state-active')) return 'ya'; b.click(); return 'ok'; },
    // Tabla genérica SIN columnas de nombres (solo se cuentan cosas: nunca se guardan datos de otras personas)
    tablaSinNombres() {
      const zona = document.getElementById('formData') || document;
      const tabla = [...zona.querySelectorAll('table')].find(t => !t.hasAttribute('data-mb-viejo') && t.querySelectorAll('tbody tr').length > 0);
      const visibles = sel => [...document.querySelectorAll(sel)].filter(e => e.offsetParent !== null).map(e => e.innerText.trim()).filter(Boolean).join(' ');
      if (!tabla) return { filas: null, error: visibles('.ui-messages-error, .ui-message-error, .ui-growl-message'), captcha: visibles('#messageErrorCaptchaOffline') };
      const cab = [...tabla.querySelectorAll('thead th')].map(th => norm(th.innerText));
      const quitar = cab.map(h => /NOM|APELL|COGNOM|DNI|NIF/.test(h) && !/NOMBRAM|NOMENAM|^T\.?\s*NOM/.test(h));
      const celda = td => { const c = td.cloneNode(true); c.querySelectorAll('.ui-column-title').forEach(e => e.remove()); return (c.textContent || '').replace(/\s+/g, ' ').trim(); };
      const filas = [...tabla.querySelectorAll('tbody tr')].map(tr => [...tr.querySelectorAll('td')].map(celda)).filter(c => c.length > 1)
        .map(c => c.filter((x, i) => !quitar[i]));
      return { cab: cab.filter((h, i) => !quitar[i]), filas, rangos: (this.rangos() || []).length };
    },
    // Penalizaciones: busca SOLO tu fila (por palabras de tu nombre) y devuelve tus datos sin el nombre
    buscarYo(palabras) {
      const zona = document.getElementById('formData') || document;
      const tabla = [...zona.querySelectorAll('table')].find(t => !t.hasAttribute('data-mb-viejo') && t.querySelectorAll('tbody tr').length > 0);
      const visibles = sel => [...document.querySelectorAll(sel)].filter(e => e.offsetParent !== null).map(e => e.innerText.trim()).filter(Boolean).join(' ');
      if (!tabla) return { hecho: false, error: visibles('.ui-messages-error, .ui-message-error, .ui-growl-message'), captcha: visibles('#messageErrorCaptchaOffline') };
      const cab = [...tabla.querySelectorAll('thead th')].map(th => norm(th.innerText));
      const celda = td => { const c = td.cloneNode(true); c.querySelectorAll('.ui-column-title').forEach(e => e.remove()); return (c.textContent || '').replace(/\s+/g, ' ').trim(); };
      const vacia = tabla.querySelector('.ui-datatable-empty-message');
      for (const tr of tabla.querySelectorAll('tbody tr')) {
        const c = [...tr.querySelectorAll('td')].map(celda);
        const p = norm(c.join(' ')).split(' ');
        if (palabras.length && palabras.every(w => p.includes(w))) {
          const out = {};
          cab.forEach((h, i) => { if (!(/NOM|APELL|COGNOM|DNI|NIF/.test(h))) out[h] = c[i]; });
          return { hecho: true, yo: out };
        }
      }
      return { hecho: true, yo: null, vacia: !!vacia, rangos: (this.rangos() || []).length };
    },
    marcar() { document.querySelectorAll('table').forEach(t => t.setAttribute('data-mb-viejo', '1')); return true; },
    enviar() { const b = document.getElementById('filToogle:formDynamicFilters:obtenerListado'); if (!b) return false; b.click(); return true; },
    leer() {
      const zona = document.getElementById('formData') || document;
      const tabla = [...zona.querySelectorAll('table')].find(t => !t.hasAttribute('data-mb-viejo') && t.querySelectorAll('tbody tr').length > 0);
      const visibles = sel => [...document.querySelectorAll(sel)].filter(e => e.offsetParent !== null).map(e => e.innerText.trim()).filter(Boolean).join(' ');
      const err = visibles('.ui-messages-error, .ui-message-error, .ui-growl-message');
      const captcha = visibles('#messageErrorCaptchaOffline');
      if (!tabla) {
        // La GVA a veces responde con un mensaje en lugar de una tabla vacía: eso también es «no hay nadie»
        const z = document.getElementById('formData');
        const txt = z && z.offsetParent !== null ? z.innerText : '';
        if (/no se (han )?encontrado|no hay (resultados|registros|datos)|sin resultados|no existen|ning[uú]n (resultado|registro)/i.test(txt + ' ' + err)) return { filas: [], cab: [], vacia: true, error: '' };
        return { filas: null, error: err, captcha };
      }
      const cab = [...tabla.querySelectorAll('thead th, tr:first-child th')].map(th => norm(th.innerText));
      const col = re => cab.findIndex(h => re.test(h));
      const ix = { pos: col(/^(LLOC|PUESTO|ORDEN|N)/), nom: col(/^NOM/), sit: col(/SITUA/), per: col(/PERFIL/), cat: col(/CATEG/), dep: col(/DEPART/) };
      // En móvil la GVA mete el título de la columna dentro de cada celda («Puesto 123»): se quita
      const celda = td => { const c = td.cloneNode(true); c.querySelectorAll('.ui-column-title').forEach(e => e.remove()); return (c.textContent || '').replace(/\s+/g, ' ').trim()
        .replace(/^(Lloc|Puesto|Nombre|Nom|Situaci[oó]n?|Perfiles|Perfils|Perfil|Categor[ií]a|Departamento|Departament)\s*:?\s*/i, ''); };
      const filas = [...tabla.querySelectorAll('tbody tr')].map(tr => [...tr.querySelectorAll('td')].map(celda))
        .filter(c => c.length > 1).map(c => ({
          pos: parseInt(((c[ix.pos >= 0 ? ix.pos : 0] || '').match(/\d+/) || [])[0], 10), nom: norm(c[ix.nom >= 0 ? ix.nom : 1]),
          sit: norm(c[ix.sit >= 0 ? ix.sit : 2]), per: ix.per >= 0 ? c[ix.per] : '', cat: ix.cat >= 0 ? c[ix.cat] : '', dep: ix.dep >= 0 ? c[ix.dep] : ''
        }));
      const rango = [...document.querySelectorAll('select')].find(s => [...s.options].some(o => /^\d+\s*-\s*\d+$/.test(o.text.trim())));
      return { filas, cab, error: err, tramo: rango ? rango.options[rango.selectedIndex].text.trim() : '' };
    }
  };
  return true;
}

// Cada orden se ejecuta en la página de la GVA: si la página ha cambiado (navegación) se
// vuelven a poner las funciones, y si algo falla se apunta el error en el registro.
// Límite de tiempo para cada orden al navegador y botón «Cancelar»: la búsqueda nunca se queda colgada
let cancelado = false, limiteBusqueda = 0, limiteDep = 0;
const conTiempo = (p, ms, msg) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error(msg)), ms))]);
function revisarCancel() {
  if (cancelado) throw new Error('Búsqueda cancelada');
  if (limiteBusqueda && Date.now() > limiteBusqueda) { cancelado = true; throw new Error('La búsqueda ha tardado demasiado'); }
  if (limiteDep && Date.now() > limiteDep) { limiteDep = 0; throw new Error('TIEMPO'); }
}
async function abrirNav(url) { revisarCancel(); await conTiempo(NAV.abrir({ url }), 30000, 'La web de la GVA no responde'); }
async function ev(expr) {
  revisarCancel();
  const js = '(function(){try{if(!window.__mb){(' + paginaGVA.toString() + ')()}return (' + expr + ');}' +
    'catch(e){return {__err: String((e && e.message) || e)}}})()';
  let r;
  try { r = await conTiempo(NAV.ejecutar({ js }), 12000, 'sin respuesta'); } catch (e) { paso('Error del navegador: ' + (e.message || e)); revisarCancel(); return null; }
  let v = null;
  try { v = JSON.parse(r && r.valor); } catch (e) { v = null; }
  if (v && v.__err) { paso('Error en la página: ' + v.__err + ' [' + expr.slice(0, 40) + ']'); return null; }
  return v;
}
async function esperar(expr, ms, paso = 300) {
  const fin = Date.now() + ms;
  while (Date.now() < fin) { revisarCancel(); if (await ev(expr)) return true; await sleep(paso); }
  return false;
}
async function prepararPagina() {
  await ev('(' + paginaGVA.toString() + ')()');
}

// Registro de la última búsqueda (pasos y segundos), para ver dónde se atasca
let registro = [], t0 = 0;
function paso(msg) {
  if (registro.length && registro[registro.length - 1].endsWith(' · ' + msg)) return; // sin repetir
  const s = ((Date.now() - t0) / 1000).toFixed(1);
  registro.push(s + ' s · ' + msg);
  document.getElementById('ovS').textContent = msg;
}

// Espera a que Cloudflare dé el visto bueno. Si no llega solo en 3 s, se enseña la página de la
// GVA para que la persona toque la casilla (nunca se intenta saltar ni resolver por ella).
let verVisible = false;
async function verificacion(etiqueta) {
  if (await esperar('window.__mb.verificado()', 10000)) { paso('Verificación superada sola'); return true; }
  paso('Cloudflare pide verificación: se enseña la casilla');
  let cerrado = false;
  const h = await NAV.addListener('cerrado', () => { cerrado = true; });
  await ev('(function(){var t=document.getElementById("turnstileTarget");if(t)t.scrollIntoView({block:"center"});return true})()');
  if (!verVisible) await NAV.mostrar({ titulo: t('toca') });
  ovOff();
  if (limiteDep) limiteDep += 120000;
  const fin = Date.now() + 120000;
  let ok = false;
  while (Date.now() < fin && !cerrado && !cancelado) { if (await ev('window.__mb.verificado()')) { ok = true; break; } await sleep(400); }
  if (!verVisible) await NAV.ocultar();
  h.remove();
  ov(t('act'), etiqueta);
  paso(ok ? 'Verificación superada tocando la casilla' : (cerrado ? 'Verificación cerrada sin completar' : 'Verificación: tiempo agotado'));
  return ok;
}

async function esperarTabla(segundos) {
  const fin = Date.now() + segundos * 1000;
  let res = null;
  await sleep(500);
  while (Date.now() < fin) {
    await sleep(500); revisarCancel();
    if (!await ev('window.__mb.listo()')) continue;
    res = await ev('window.__mb.leer()');
    if (res && (res.filas || res.error)) break;
    if (res && res.captcha) break;
  }
  return res;
}

// Recuentos de una lista (solo números: nunca se guardan nombres de otras personas)
function contar(filas) {
  const c = { activos: 0, desactivados: 0, noDisp: 0, disponibles: 0, total: 0 };
  for (const f of filas) {
    c.total++;
    if (/DESACTIV/.test(f.sit)) c.desactivados++;
    else if (/NO DISPONIBLE/.test(f.sit)) c.noDisp++;
    else if (/ACTI/.test(f.sit)) c.activos++;
    else if (/DISPONIBLE/.test(f.sit)) c.disponibles++;
  }
  return c;
}
const sumar = (a, b) => ({ activos: a.activos + b.activos, desactivados: a.desactivados + b.desactivados, noDisp: a.noDisp + b.noDisp, disponibles: a.disponibles + b.disponibles, total: a.total + b.total });
const inicioTramo = tx => { const m = (tx || '').match(/^(\d+)/); return m ? +m[1] : 1; };

// Cambia de tramo (1-200, 201-400…) y espera la tabla nueva; si la GVA pide verificación, se enseña
async function irATramo(n, etiqueta) {
  const r = await ev('window.__mb.elegirRango(' + n + ')');
  if (r === 'ya') return await ev('window.__mb.leer()');
  if (r !== 'ok') { paso('Tramo ' + n + ': ' + r); return null; }
  await ev('window.__mb.marcar()');
  let res = await esperarTabla(15);
  if (!(res && res.filas) && await verificacion(etiqueta)) {
    await ev('window.__mb.marcar()');
    await ev('window.__mb.elegirRango(' + n + ')');
    res = await esperarTabla(20);
  }
  return res && res.filas ? res : null;
}

// conNombre: filtra por tu nombre (para saber tu puesto). puesto: si se sabe, se pide la lista
// completa, se salta a tu tramo y se cuentan también los tramos anteriores (todos los de delante).
async function consultarDep(url, b, dep, etiqueta, conNombre = true, puesto = null) {
  ov(t('act'), etiqueta);
  paso(etiqueta + ': abriendo la consulta');
  await abrirNav(url);
  await prepararPagina();
  if (!await esperar('window.__mb.listo()', 20000)) throw new Error('La página de la GVA no ha cargado');
  for (const [n, v] of [[0, b.cat], [1, b.turno], [2, dep]]) {
    const r = await ev('window.__mb.elegir(' + n + ',' + JSON.stringify(v) + ')');
    if (r !== 'ok') throw new Error('No se pudo elegir ' + ['la categoría', 'el turno', 'el departamento'][n] + ' (' + r + ')');
    await esperar('window.__mb.listo()', 10000, 200);
  }
  const nom = conNombre ? [perfil.ap1, perfil.ap2, perfil.nombre] : ['', '', ''];
  await ev('window.__mb.escribir(' + nom.map(x => JSON.stringify(x || '')).join(',') + ')');
  paso(conNombre ? 'Formulario rellenado (con tu nombre)' : 'Formulario rellenado (lista completa)');
  if (!await verificacion(etiqueta)) throw new Error('No se completó la verificación de Cloudflare');
  await ev('window.__mb.marcar()');
  await ev('window.__mb.enviar()');
  paso('Consulta enviada a la GVA');
  let res = await esperarTabla(25);
  if (res && !res.filas && res.captcha) paso('La GVA no aceptó la verificación');
  if (!res || !res.filas) throw new Error(res && (res.error || res.captcha) ? (res.error || res.captcha) : 'La GVA no ha devuelto la lista');
  paso('Lista recibida: ' + res.filas.length + ' filas' + (res.tramo ? ' (tramo ' + res.tramo + ')' : '') + ' · columnas: ' + (res.cab || []).join(', '));
  if (!puesto) return res;

  // Recuentos ya vistos por tramo (el primero que devuelve la GVA suele ser 1-200)
  const vistos = {};
  if (res.tramo) vistos[inicioTramo(res.tramo)] = contar(res.filas);
  const rangos = (await ev('window.__mb.rangos()')) || [];
  const mio = rangos.find(r => puesto >= r[0] && puesto <= r[1]);
  if (mio && inicioTramo(res.tramo) !== mio[0]) {
    paso('Saltando a tu tramo ' + mio[0] + '-' + mio[1]);
    const r2 = await irATramo(mio[0], etiqueta);
    if (!r2) { paso('No se pudo cambiar de tramo'); res.parcial = true; return res; }
    res = r2;
  }
  // Tramos anteriores al tuyo: toda esa gente también está delante
  let antes = { activos: 0, desactivados: 0, noDisp: 0, disponibles: 0, total: 0 }, completos = true;
  const previos = rangos.filter(r => mio && r[1] < mio[0]);
  for (const r of previos) {
    if (!vistos[r[0]]) {
      paso('Contando el tramo ' + r[0] + '-' + r[1]);
      const rr = await irATramo(r[0], etiqueta);
      if (!rr) { completos = false; break; }
      vistos[r[0]] = contar(rr.filas);
    }
    antes = sumar(antes, vistos[r[0]]);
  }
  res.antes = completos ? antes : null;
  res.tramos = previos.length && completos ? '1-' + mio[1] : '';
  return res;
}

// ── Nombramientos de los últimos meses: solo se cuentan (por departamento y tipo), sin nombres ──
// La tabla de la GVA usa letras: TNom A acumulación, C ATC/guardias, I interinidad (vacante), S sustitución; Jor A ATC, N ordinaria, P parcial
const TNOM = { A: 'Acumulación de tareas', C: 'ATC/Guardias', I: 'Interinidad (vacante)', S: 'Sustitución' };
const JORN = { A: 'ATC', N: 'Jornada ordinaria', P: 'Tiempo parcial' };
const sinTitulo = x => String(x || '').replace(/^[A-Za-zÀ-ÿ. ]{1,20}:\s*/, '').trim();
// Nombre completo de un tipo o jornada (también arregla los guardados como «Tnom: s»)
const nombreDe = (tabla, k) => { const x = sinTitulo(k), c = x.toUpperCase(); return tabla[c] || Object.values(tabla).find(v => v.toUpperCase() === c) || cap(x); };
const nomTipo = k => nombreDe(TNOM, k);
const nomJor = k => nombreDe(JORN, k);
const juntar = (o, f) => Object.entries(o || {}).reduce((m, [k, n]) => { const x = f(k); m[x] = (m[x] || 0) + n; return m; }, {});
const tipoLargo = x => x === 'I' || /VACANT|INTERIN/.test(x);
const tipoCorto = x => /^[ACS]$/.test(x) || /SUSTIT|EVENTUAL|ACUMUL|REFUER|PROGRAM|TEMPORAL|CORTA|ATC|GUARD/.test(x);
async function abrirConsulta(url, etiqueta) {
  ov(t('act'), etiqueta);
  paso(etiqueta + ': abriendo la consulta');
  await abrirNav(url);
  await prepararPagina();
  if (!await esperar('window.__mb.quieto()', 20000)) throw new Error('La página de la GVA no ha cargado');
}
async function consultarNombramientos(lista, cat) {
  const etiqueta = t('actividad') + ' · ' + catCorta(cat);
  // La consulta trae los dos turnos juntos (columna TURNO). Se piden los últimos meses (hasta 3): uno por consulta
  const una = async (iMes, primera) => {
    if (!primera) await abrirConsulta(lista.nomb.url, etiqueta);
    const meses = (await ev('window.__mb.meses()')) || [];
    if (meses.length) {
      if (!meses[iMes]) return null;
      const r = await ev('window.__mb.elegirMes(' + iMes + ')');
      if (r === 'ok') { await sleep(800); await prepararPagina(); await esperar('window.__mb.quieto()', 15000, 300); }
    } else if (iMes > 0) return null;
    const r = await ev('window.__mb.elegir(0,' + JSON.stringify(cat) + ')');
    if (r !== 'ok') throw new Error('No se pudo elegir la categoría (' + r + ')');
    await esperar('window.__mb.quieto()', 10000, 200);
    await ev('window.__mb.escribir("","","")');
    if (!await verificacion(etiqueta)) throw new Error('No se completó la verificación de Cloudflare');
    await ev('window.__mb.marcar()');
    await ev('window.__mb.enviar()');
    const txt = meses.length ? meses[iMes].txt : '';
    paso('Consulta de nombramientos enviada (' + txt + ')');
    const fin = Date.now() + 40000;
    let res = null;
    while (Date.now() < fin) {
      await sleep(600);
      if (!await ev('window.__mb.quieto()')) continue;
      res = await ev('window.__mb.tablaSinNombres()');
      if (res && (res.filas || res.error || res.captcha)) break;
    }
    if (!res || !res.filas) {
      if (res && res.error && !res.captcha && iMes > 0) { paso(txt + ' sin resultados: ' + res.error); return { cab: [], filas: [], rangos: 0, mes: txt }; }
      throw new Error(res && (res.error || res.captcha) || 'La GVA no ha devuelto los nombramientos');
    }
    res.mes = txt;
    res.filas = res.filas.map(f => f.map(sinTitulo));
    paso('Nombramientos ' + txt + ': ' + res.filas.length + ' filas · columnas: ' + res.cab.join(', '));
    return res;
  };
  await abrirConsulta(lista.nomb.url, etiqueta);
  const r0 = await una(0, true);
  const todos = [r0];
  for (let i = 1; i < 3; i++) {
    try { const ri = await una(i, false); if (!ri) break; todos.push(ri); } catch (e) { paso('Mes ' + (i + 1) + ': ' + e.message); break; }
  }
  const cab = todos.find(x => x.cab.length).cab;
  const out = resumirNomb(cab, r0.filas, r0.mes, r0.rangos);
  if (todos.length > 1) {
    out.tres = resumirNomb(cab, todos.flatMap(x => x.filas), todos.map(x => cap(x.mes)).reverse().join(' – '), Math.max(...todos.map(x => x.rangos || 0)));
    out.tres.nMeses = todos.length;
  }
  return out;
}
function resumirNomb(cab, filas, mes, rangos) {
  const res = { cab, filas, rangos };
  // Recuento por departamento y tipo (y el puesto más alto llamado, si la tabla lo trae)
  const col = re => res.cab.findIndex(h => re.test(String(h).toUpperCase().trim()));
  const iDep = col(/DEPART/), iTipo = col(/^T\.?\s*NOM|TIPO|MOTIVO|CLASE|MODALI|NOMBRAM/), iPos = col(/LLOC|PUESTO|ORDEN|POSICI/), iTurno = col(/^T\.?$|TURNO|TORN|ACCES/);
  const iIni = col(/INICI|DESDE|ALTA|INCORP|TOMA/), iFin = col(/(^|[\s.])FI(N)?(\s|$)|F\.?\s*FIN|FINAL|HASTA|FINS|BAJA|CESE/), iJor = col(/^JOR|JORNADA|DEDICA/);
  const dia = x => { const m = (x || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? new Date(+m[3], m[2] - 1, +m[1]).getTime() : null; };
  const tipos = {}, jor = {}, dur = { d1: 0, d2: 0, d3: 0, d4: 0, d5: 0 };
  for (const f of res.filas) {
    const t0 = iTipo >= 0 ? (f[iTipo] || '').toUpperCase().trim() : '', tp = TNOM[t0] || cap(t0);
    if (tp) tipos[tp] = (tipos[tp] || 0) + 1;
    const j0 = iJor >= 0 ? (f[iJor] || '').toUpperCase().trim() : '', jn = JORN[j0] || cap(j0);
    if (jn) jor[jn] = (jor[jn] || 0) + 1;
    if (iIni >= 0 && iFin >= 0) {
      const a = dia(f[iIni]), z = dia(f[iFin]);
      if (a && !z) dur.d5++; else if (a && z) { const d = (z - a) / 864e5; if (d < 7) dur.d1++; else if (d <= 31) dur.d2++; else if (d <= 183) dur.d3++; else dur.d4++; }
    }
  }
  paso('Columnas usadas: tipo=' + iTipo + ' inicio=' + iIni + ' fin=' + iFin + ' jornada=' + iJor + ' turno=' + iTurno);
  const porDep = {}, vac = { O: 0, P: 0, otro: 0, lista: [] };
  for (const f of res.filas) {
    const dn = iDep >= 0 ? f[iDep] : '?';
    const code = (DEPS.find(d => norm2(d[1]) === norm2(dn) || norm2(dn).includes(norm2(d[1]))) || [dn])[0];
    const tp = (iTipo >= 0 ? f[iTipo] : '').toUpperCase();
    const o = porDep[code] || (porDep[code] = { n: 0, largos: 0, cortos: 0, otros: 0, max: 0, turnos: {} });
    o.n++;
    if (tipoLargo(tp)) o.largos++; else if (tipoCorto(tp)) o.cortos++; else o.otros++;
    const pz = iPos >= 0 ? parseInt((f[iPos].match(/\d+/) || [])[0], 10) : NaN;
    if (pz > o.max) o.max = pz;
    const tu = iTurno >= 0 ? (f[iTurno] || '').toUpperCase().trim().charAt(0) : '';
    if (iTurno >= 0) o.turnos[tu] = (o.turnos[tu] || 0) + 1;
    // Interinidades (vacantes): por turno ordinario (O) o promoción interna temporal (P). Sin nombres: departamento, turno, posición y fecha
    if (tipoLargo(tp)) {
      o.vac = o.vac || { O: 0, P: 0 };
      if (tu === 'O' || tu === 'P') { vac[tu]++; o.vac[tu]++; } else vac.otro++;
      vac.lista.push({ dep: code, turno: tu, pos: isNaN(pz) ? null : pz, ini: iIni >= 0 ? f[iIni] : '' });
    }
  }
  paso('Interinidades (vacantes): ' + vac.lista.length + ' · ordinario ' + vac.O + ' · promoción interna ' + vac.P);
  const turnoTot = { O: 0, P: 0 }; Object.values(porDep).forEach(o => { turnoTot.O += o.turnos.O || 0; turnoTot.P += o.turnos.P || 0; });
  return { v: 5, mes, total: res.filas.length, turnoTot: iTurno >= 0 ? turnoTot : null, porDep, vac: iTipo >= 0 ? vac : null, tipos, jor, dur: (dur.d1 + dur.d2 + dur.d3 + dur.d4 + dur.d5) ? dur : null, parcial: res.rangos > 1, conTipo: iTipo >= 0, conPuesto: iPos >= 0, fecha: Date.now() };
}

// ── Penalizaciones: se mira solo si TÚ apareces (por tu nombre), sin guardar a nadie más ──
const TERRIT = { A: ['SA', 'ALI', 'CTA', 'DEN', 'ELX', 'ELD', 'MBA', 'ORI', 'SPA', 'SJO', 'TRV'], C: ['SC', 'CAS', 'CTC', 'PLA', 'SPC', 'VIN'], Y: ['ALY', 'SPY'] };
const territorioNom = { V: 'València', A: 'Alacant', C: 'Castelló', Y: 'Alcoi' };
const territorio = d => Object.keys(TERRIT).find(k => TERRIT[k].includes(d)) || 'V';
async function consultarPenalizaciones(lista, terr, enl = lista.pen, nombre = t('penal')) {
  const etiqueta = nombre + ' · ' + ({ V: 'València', A: 'Alacant', C: 'Castelló', Y: 'Alcoi' }[terr]);
  await abrirConsulta(enl.url, etiqueta);
  const hayFiltro = await ev('document.querySelectorAll("#filToogle select").length');
  if (hayFiltro) {
    const r = await ev('window.__mb.elegir(0,' + JSON.stringify(terr) + ')');
    if (r !== 'ok') {
      paso(etiqueta + ': opciones = ' + JSON.stringify(await ev('[...document.querySelectorAll("#filToogle select")].map(s => [...s.options].map(o => o.value).join("/"))')));
      throw new Error('No se pudo elegir la dirección territorial (' + r + ')');
    }
  }
  await esperar('window.__mb.quieto()', 10000, 200);
  if (!await verificacion(etiqueta)) throw new Error('No se completó la verificación de Cloudflare');
  await ev('window.__mb.marcar()');
  await ev('window.__mb.enviar()');
  const pals = JSON.stringify(norm2([perfil.ap1, perfil.ap2, perfil.nombre].join(' ')).toUpperCase().split(/\s+/).filter(Boolean));
  const fin = Date.now() + 40000;
  let res = null;
  while (Date.now() < fin) {
    await sleep(600);
    if (!await ev('window.__mb.quieto()')) continue;
    res = await ev('window.__mb.buscarYo(' + pals + ')');
    if (res && (res.hecho || res.error || res.captcha)) break;
  }
  if (!res || !res.hecho) throw new Error(res && (res.error || res.captcha) || 'La GVA no ha devuelto la lista de penalizaciones');
  // Si la lista tiene varios tramos y no apareces en el primero, se miran los demás (hasta 8)
  if (!res.yo && res.rangos > 1) {
    const rg = (await ev('window.__mb.rangos()')) || [];
    for (const x of rg.slice(1, 9)) {
      const ok = await irATramo(x[0], etiqueta);
      if (!ok) break;
      const r2 = await ev('window.__mb.buscarYo(' + pals + ')');
      if (r2 && r2.yo) { res = r2; break; }
    }
  }
  paso('Penalizaciones ' + terr + ': ' + (res.yo ? 'apareces' : 'no apareces'));
  return { terr, yo: res.yo || null, fecha: Date.now() };
}

// De la lista solo se guarda TU fila y recuentos: nunca nombres de otras personas
function resumir(res, b, puestoSabido = null) {
  const pal = x => (x || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9Ñ ]+/g, ' ').split(/\s+/).filter(Boolean);
  const mias = pal([perfil.ap1, perfil.ap2, perfil.nombre].join(' '));
  const esYo = f => !mias.length || mias.every(w => pal(f.nom).includes(w));
  const p = b.puesto || puestoSabido;
  let mia = null;
  if (p) mia = res.filas.find(f => f.pos === p && esYo(f)) || null;
  if (!mia && mias.length) mia = res.filas.find(f => mias.every(w => pal(f.nom).includes(w))) || null;
  let delante = mia ? contar(res.filas.filter(f => f.pos < mia.pos)) : contar(res.filas);
  let alcance = 'tramo';
  if (mia && res.antes) { delante = sumar(delante, res.antes); alcance = 'todo'; }
  if (mia && inicioTramo(res.tramo) === 1 && !res.parcial) alcance = 'todo';
  return {
    identificado: !!(p || mias.length), encontrado: !!mia, puesto: mia ? mia.pos : null, situacion: mia ? mia.sit : '', perfil: mia ? mia.per : '',
    trabaja: mia && mia.dep ? [mia.cat, mia.dep].filter(Boolean).join(' · ') : '', tramo: res.tramo, alcance, tramos: res.tramos || '', delante
  };
}

// Una bolsa y un departamento: primero tu puesto (si hace falta), luego la lista completa
async function consultarBolsa(lista, b, dep, etiqueta) {
  const prev = datos[clave(b, dep)];
  const conNombre = conNombreP();
  let sabido = b.puesto || (prev && prev.encontrado && prev.puesto) || null;
  let rA = null;
  if (conNombre && !sabido) {
    rA = resumir(await consultarDep(lista.url, b, dep, etiqueta, true), b);
    sabido = rA.puesto;
    paso(sabido ? 'Tu puesto: ' + sabido : 'No apareces con ese nombre');
  }
  let r = rA;
  if (sabido || !conNombre) {
    const rB = resumir(await consultarDep(lista.url, b, dep, etiqueta, false, sabido), b, sabido);
    if (rB.encontrado || !conNombre) r = rB;
    else if (!rA) { r = rA = resumir(await consultarDep(lista.url, b, dep, etiqueta, true), b); }
  }
  if (r === rA && r && r.encontrado) r.delante = null; // con el filtro de nombre no se puede contar
  return r;
}

const $app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// «ENFERMERA/O SAMU» → «Enfermera/o SAMU»: siglas en mayúsculas, el resto en minúscula con inicial
const SIGLAS = new Set(['SAMU', 'SES', 'GVA', 'AP', 'EAP', 'E.A.P.', 'C.I.C.U.', 'S.P.', 'P.', 'T.E.', 'F.', 'ESP.', 'M-Q', 'UCI', 'S.', 'C.TRANS.', 'TCAE']);
const MENUDAS = new Set(['de', 'del', 'y', 'en', 'la', 'el', 'los', 'las', 'a', 'o', 'e', 'para', 'por']);
const cap = s => (s || '').split(' ').map((w, i) => {
  if (SIGLAS.has(w) || /\d/.test(w)) return w;
  const l = w.toLowerCase();
  if (i > 0 && MENUDAS.has(l)) return l;
  if (/^d'./.test(l)) return "d'" + l.charAt(2).toUpperCase() + l.slice(3);
  return l.charAt(0).toUpperCase() + l.slice(1);
}).join(' ');
const catCorta = c => cap(catName(c));
const sitCorta = s => cap((s || '').replace(/^SITUACION\s*/, ''));
const fechaTxt = tx => { const m = (tx || '').match(/(\d{1,2}\/\d{1,2}\/\d{4})/); return m ? m[1] : ''; };
function ov(tt, s, frac) {
  document.getElementById('ovXt').textContent = t('cancelar2');
  document.getElementById('ovT').textContent = tt; document.getElementById('ovS').textContent = s || '';
  if (typeof frac === 'number') progreso(frac);
  document.getElementById('overlay').style.display = 'flex';
}
function progreso(frac, s) {
  document.getElementById('ovP').style.width = Math.max(5, Math.min(100, frac * 100)) + '%';
  if (s) document.getElementById('ovT').textContent = s;
}
function ovOff() { document.getElementById('overlay').style.display = 'none'; }
const norm2 = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

// Hoja inferior con buscador (categorías y departamentos)

const gruposCat = () => [{ t: t('ses'), ops: CATS.filter(c => SES_CATS.includes(c[0])) }, { t: t('todas'), ops: CATS.filter(c => !SES_CATS.includes(c[0])) }];
const gruposDep = usados => [{ t: t('ses'), ops: DEPS.filter(d => SES_DEPS.includes(d[0]) && !usados.includes(d[0])) }, { t: t('depsT'), ops: DEPS.filter(d => !SES_DEPS.includes(d[0]) && !usados.includes(d[0])) }];

      <div class="row"><div><label class="l">${t('ap2')}</label><input id="fAp2" value="${esc(p.ap2)}"></div>
      <div><label class="l">${t('nombre')}</label><input id="fNom" autocomplete="given-name" value="${esc(p.nombre)}"></div></div>
      ${p.bolsas.length === 1 ? `<label class="l">${t('puestoO')}</label><input id="fPuesto" inputmode="numeric" placeholder="${t('ej')}" value="${p.bolsas[0].puesto || ''}">` : ''}

// ───────────────────────── Evolución, estimación y novedades ─────────────────────────
function fechaPub(tx) { const m = (tx || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? new Date(+m[3], m[2] - 1, +m[1]).getTime() : null; }

// Un punto por publicación (si se actualiza varias veces la misma, se sustituye el último)
function sumarHist(h, r, pub) {
  h = (h || []).slice();
  if (!r.encontrado || !r.delante) return h;
  const pt = { f: Date.now(), fp: fechaPub(pub) || Date.now(), pub, puesto: r.puesto, sit: r.situacion, alc: r.alcance,
    act: r.delante.activos, des: r.delante.desactivados, nd: r.delante.noDisp, disp: r.delante.disponibles };
  if (h.length && h[h.length - 1].pub === pub) h[h.length - 1] = pt; else h.push(pt);
  return h.slice(-60);
}

function cambios(nom, prev, r) {
  const out = [];
  if (!prev || !prev.encontrado || !r.encontrado) return out;
  if (prev.situacion && r.situacion && prev.situacion !== r.situacion) out.push(t('cambioSit', nom, sitCorta(prev.situacion), sitCorta(r.situacion)));
  if (prev.puesto && r.puesto && prev.puesto !== r.puesto) out.push(t('cambioPuesto', nom, prev.puesto, r.puesto));
  if (prev.delante && r.delante && prev.alcance === r.alcance) {
    const x = prev.delante.disponibles - r.delante.disponibles;
    if (x > 0) out.push(t('menosDisp', nom, x));
    if (x < 0) out.push(t('masDisp', nom, -x));
    const a = r.delante.activos - prev.delante.activos;
    if (a > 0) out.push(t('empiezan', nom, a));
  }
  return out;
}

function grafica(h) {
  const pts = (h || []).filter(p => typeof p.disp === 'number');
  if (pts.length < 2) return '<div class="note">' + t('grafFalta') + '</div>';
  const W = 300, H = 76, max = Math.max(1, ...pts.map(p => p.disp)), n = pts.length;
  const xy = pts.map((p, i) => [8 + i * (W - 16) / (n - 1), 8 + (H - 16) * (1 - p.disp / max)]);
  const linea = xy.map(c => c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const area = '8,' + H + ' ' + linea + ' ' + (W - 8) + ',' + H;
  const f = x => new Date(x).toLocaleDateString(lang === 'va' ? 'ca-ES' : 'es-ES', { day: 'numeric', month: 'short' });
  return `<div class="graf"><div class="note" style="margin:0 0 6px">${t('grafT')}</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="${t('grafT')}">
      <defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".28"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>
      <polygon points="${area}" fill="url(#gA)"/>
      <polyline points="${linea}" fill="none" stroke="var(--acc)" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
      ${xy.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.2" fill="var(--acc)"/>`).join('')}
    </svg>
    <div class="ej"><span>${f(pts[0].fp)} · ${pts[0].disp}</span><span>${f(pts[n - 1].fp)} · ${pts[n - 1].disp}</span></div></div>`;
}

// Aproximación: cuánto bajan los disponibles de delante al mes y cuánto falta
function estimacion(h, dl) {
  if (!dl) return '';
  if (dl.disponibles === 0) return '<div class="est">' + t('nadie') + '</div>';
  const pts = (h || []).filter(p => typeof p.disp === 'number');
  if (pts.length < 2) return '<div class="note">' + t('masPub') + '</div>';
  const a = pts[0], b = pts[pts.length - 1], dias = (b.fp - a.fp) / 86400000;
  if (dias < 7) return '<div class="note">' + t('masSem') + '</div>';
  const baja = a.disp - b.disp;
  if (baja <= 0) return '<div class="note">' + t('noBaja', Math.round(dias / 7)) + '</div>';
  const porMes = baja / dias * 30, falta = dl.disponibles / (baja / dias);
  const cuanto = falta < 14 ? t('dias', Math.max(1, Math.round(falta))) : falta < 60 ? t('semanas', Math.round(falta / 7)) : t('meses', Math.round(falta / 30));
  return '<div class="est">' + t('estim', porMes < 1 ? porMes.toFixed(1) : Math.round(porMes), cuanto) + '</div>';
}

// Pestaña Evolución: estimación, predicción y gráfica de cada bolsa donde te ha encontrado
function evolucionCard(b, dep) {

// ───────────────────────── Actividad, predicción, comparación, penalizaciones, calendario ─────────────────────────
function nombDep(b, dep) {
  const a = store.get('actividad', {})[b.cat];
  const o = a && a.porDep && a.porDep[dep];
  if (!o) return null;
  // Si la tabla trae el turno, se cuentan solo los nombramientos de tu turno
  let f = 1;
  const tk = Object.keys(o.turnos || {});
  if (tk.length) {
    const mio = tk.filter(k => b.turno === 'P' ? /PROMO/i.test(k) : !/PROMO/i.test(k)).reduce((x, k) => x + o.turnos[k], 0);
    f = o.n ? mio / o.n : 1;
  }
  return { mes: a.mes, n: o.n * f, largos: o.largos * f, cortos: o.cortos * f, max: o.max };
}
const enMeses = m => !isFinite(m) ? t('predNo') : m < 1 ? t('menos1') : Math.round(m) === 1 ? t('meses1', 1) : t('mesesN', Math.round(m));
function prediccion(b, dep, dl) {
  if (!dl) return '';
  const o = nombDep(b, dep);
  if (!o || !o.n) return '';
  return `<div class="note" style="margin-top:14px;font-weight:600">${t('predT')}</div>
    <div class="pred"><div>${t('largos').split(' (')[0]}<b>${enMeses(dl.disponibles / o.largos)}</b></div><div>${t('cortos').split(' (')[0]}<b>${enMeses(dl.disponibles / o.cortos)}</b></div></div>
    <div class="note">${t('predNota', esc(cap(o.mes)), dl.disponibles)}${o.max ? ' · ' + t('hastaPuesto', o.max) : ''}</div>`;
}
function ritmoMes(h) {
  const pts = (h || []).filter(p => typeof p.disp === 'number');
  if (pts.length < 2) return null;
  const a = pts[0], z = pts[pts.length - 1], dias = (z.fp - a.fp) / 86400000;
  return dias >= 7 ? Math.max(0, (a.disp - z.disp) / dias * 30) : null;
}
function comparar(b) {
  const filas = b.deps.map(d => { const x = datos[clave(b, d)]; return x && x.encontrado && x.delante ? { d, disp: x.delante.disponibles, r: ritmoMes(x.hist), n: (nombDep(b, d) || {}).n } : null; }).filter(Boolean);
  if (filas.length < 2) return '';
  filas.forEach(f => { const v = Math.max(f.r || 0, f.n || 0); f.m = v ? f.disp / v : (f.disp === 0 ? 0 : Infinity); });
  const mejor = filas.slice().sort((x, y) => x.m - y.m || x.disp - y.disp)[0];
  const n1 = v => v == null ? '–' : (v < 10 ? v.toFixed(1).replace('.0', '') : Math.round(v));
  return `<div class="card"><h3>${t('compT')}</h3>
    <table class="tabla"><tr><th></th><th>${t('compDisp')}</th><th>${t('compRitmo')}</th><th>${t('compNomb')}</th></tr>
    ${filas.map(f => `<tr class="${f === mejor ? 'mejor' : ''}"><td>${esc(cap(depName(f.d)))}</td><td>${f.disp}</td><td>${n1(f.r)}</td><td>${n1(f.n)}</td></tr>`).join('')}</table>
    <div class="est">${t('compMejor', esc(cap(depName(mejor.d))))}</div></div>`;
}
function barras(lista) {
  lista = lista.filter(x => x[1] > 0);
  const max = Math.max(1, ...lista.map(x => x[1]));
  return lista.map(([k, n]) => `<div class="mini"><span>${esc(k)}</span><span>${n}</span></div><div class="barra"><i style="width:${Math.round(n / max * 100)}%"></i></div>`).join('');
}
// Dos fichas, una por turno: nombramientos en grande y vacantes debajo

  return `<div class="fts">${f('fo', t('vacO'), o, vo, mo)}${f('fp', t('vacP'), p, vp, mp)}</div>`;
}
function actividadCard(cat) {

  const porDep = deps.map(d => {

// ───────────────────────── Calculadora de baremo (DOGV: Orden 4/2019 y Decreto 76/2024) ─────────────────────────
const esA1A2 = c => /ENFERMER|MEDIC|MÉDIC|^F\. ESP|FAC\. ESP|FACULTATIVO|FISIOTERAP|LOGOPED|TERAPEUTA OCUP|PODÓLOG|DIETISTA|ÓPTICO|ODONTOL|PEDIATRIA AP|FARMACEUTICO DE AREA/.test(catName(c)) && !/ADM(Ó|O)N|SALUD P(Ú|U)BLICA|INSPECTOR|GESTI(Ó|O)N/.test(catName(c));
function calcBaremo(v) {
  const dec = v.norma === 'D', r = {};
  const s3 = 0.15 * v.s3, s4 = 0.10 * v.s4;
  r.serv = Math.min(70, 0.30 * v.s1 + 0.15 * v.s2 + (dec ? Math.min(5, s3) + Math.min(5, s4) : s3 + s4));
  const esc_ = dec ? [[4, 5], [5, 10], [6, 20], [7, 30], [8, 40], [9, 45], [10, 50]] : [[4, 5], [5, 10], [6, 15], [7, 20], [8, 30], [9, 40], [10, 50]];
  const n = v.opo >= 3.5 ? (esc_.find(x => v.opo <= x[0]) || [0, 50])[1] : 0;
  r.opo = Math.min(50, n / Math.max(1, v.opoN || 1));
  r.form = 7.2 * (v.res || 0);
  if (dec) {
    r.form += Math.min(10, v.doc === 'C' ? 10 : v.doc === 'S' ? 9 : 0) + Math.min(7, 3 * (v.mas || 0) + 2 * (v.prop || 0));
    r.val = { B1: 1, B2: 2, C1: 3, C2: 4 }[v.val] || 0;
    r.otros = ({ B1: 0.5, B2: 1, C1: 1.5, C2: 2 }[v.idi] || 0) + (v.dis ? 3 : 0);
  } else {
    r.form += Math.min(5, 5 * (v.c100 || 0) + 4 * (v.c75 || 0) + 3 * (v.c50 || 0) + 2 * (v.c25 || 0) + 1 * (v.c10 || 0) + 0.1 * (v.doce || 0));
    r.val = { A1: 0.5, A2: 1.5, B1: 3, B2: 4, C1: 6, C2: 8 }[v.val] || 0;
    r.otros = v.dis ? 3 : 0;
  }
  r.total = r.serv + r.opo + r.form + r.val + r.otros;
  return r;
}

function imagenSituacion(b, dep) {

  const R = (x, y, w, h, r, col) => { g.fillStyle = col; g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); g.fill(); };
  R(70, 70, 940, 940, 56, '#ffffff');
  const F = (s, w) => { g.font = w + ' ' + s + 'px -apple-system, "Segoe UI", Roboto, sans-serif'; };
  g.fillStyle = '#64748b'; F(36, '600'); g.fillText(catCorta(b.cat) + ' · ' + turnoTxt(b.turno), 130, 175);
  g.fillStyle = '#1e293b'; F(64, '800'); g.fillText(cap(depName(dep)), 130, 255);

  g.fillStyle = '#64748b'; F(34, '600'); g.fillText(t('tuPuesto'), 170, 365);

  if (d.delante) {

    g.fillStyle = '#64748b'; F(32, '600'); g.fillText(t('delante'), 130, 580);

  return c.toDataURL('image/png');
}

  const img = imagenSituacion(b, dep);
  try {
    if (NAV && NAV.compartir) await NAV.compartir({ imagen: img, texto: t('compTexto') });
    else { const a = document.createElement('a'); a.href = img; a.download = 'mi-bolsa.png'; a.click(); }
  } catch (e) {}
}

// ───────────────────────── Pantalla principal ─────────────────────────
function pie() {
  return `<footer>${t('pie1')}<br>${t('pie2')}</footer>`;
}

let pestana = store.get('tab', 'inicio');
const PESTANAS = [['inicio', '🏠', 'tInicio'], ['bolsa', '📈', 'tBolsa'], ['evol', '📊', 'tEvol'], ['zona', '👤', 'tZona'], ['ajustes', '⚙️', 'tAjustes']];
const ponerTema = () => { const v = store.get('tema', 'auto'); if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = v; };
ponerTema();
function barraPestanas(visible) {
  const nav = document.getElementById('tabs');
  nav.style.display = visible ? 'block' : 'none';
  nav.querySelector('.in').innerHTML = PESTANAS.map(p => `<button data-tab="${p[0]}" class="${p[0] === pestana ? 'on' : ''}"><span>${p[1]}</span>${t(p[2])}</button>`).join('');
  nav.onclick = e => { const b = e.target.closest('button'); if (!b) return; const otra = b.dataset.tab !== pestana; pestana = b.dataset.tab; store.set('tab', pestana); pintar(); window.scrollTo(0, 0); extrasAuto(); if (otra) anuncioCadaTanto(); };
}

// ── Hoja de información: qué significa cada situación ──
function info(titulo, html) {
  const I = document.getElementById('info');
  document.getElementById('infoT').textContent = titulo;
  document.getElementById('infoL').innerHTML = html;
  const cerrar = () => { I.style.display = 'none'; };
  document.getElementById('infoX').onclick = cerrar;
  I.onclick = e => { if (e.target === I) cerrar(); };
  I.style.display = 'flex';
}
function explicarSit(s) {
  const k = /DESACTIV/.test(s) ? 'sitDes' : /NO DISPONIBLE/.test(s) ? 'sitNo' : /ACTI/.test(s) ? 'sitAct' : /DISPONIBLE/.test(s) ? 'sitDisp' : 'sitOtra';
  info(sitCorta(s) || t('sitQue'), t(k) + '<div class="note">' + t('sitNota') + '</div>');
}

// ── Plazos que apunta la persona + próxima publicación ──
const diaMs = 86400000;
const hoy0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const fechaLarga = ms => new Date(ms).toLocaleDateString(lang === 'va' ? 'ca-ES' : 'es-ES', { weekday: 'short', day: 'numeric', month: 'long' });
function cuantoFalta(ms) {
  const n = Math.round((ms - hoy0()) / diaMs);
  return n < 0 ? t('plazHace') : n === 0 ? t('plazHoy') : n === 1 ? t('plazManana') : t('plazEn', n);
}
function plazosCard() {
  const pl = store.get('plazos', []).slice().sort((a, b) => a.fecha - b.fecha);
  const pub = proximaPub().d.getTime();
  return `<div class="card"><h3>${t('plazT')}</h3><div class="note" style="margin-top:0">${t('plazNota')}</div>
    <div class="plazo"><div><b>📢 ${t('plazPub')}</b><span>${esc(fechaLarga(pub))} · ${cuantoFalta(pub)}</span></div></div>
    ${pl.map(p => `<div class="plazo${p.fecha < hoy0() ? ' pasado' : ''}"><div><b>${esc(p.texto)}</b><span>${esc(fechaLarga(p.fecha))} · ${cuantoFalta(p.fecha)}</span></div><button class="sec" data-borrapl="${p.id}">${t('borrar')}</button></div>`).join('')}
    <label class="l">${t('plazQue')}</label><input id="plTxt" maxlength="80">
    <div class="row" style="margin-top:10px"><input id="plFec" type="date"><button class="sec" id="plAdd" style="flex:0 0 auto">${t('plazAdd')}</button></div>
    <div class="err" id="plErr" style="display:none">${t('plazFalta')}</div></div>`;
}
function enlazarPlazos() {
  const add = document.getElementById('plAdd');
  if (add) add.onclick = () => {
    const tx = document.getElementById('plTxt').value.trim(), f = document.getElementById('plFec').value;
    if (!tx || !f) { document.getElementById('plErr').style.display = 'block'; return; }
    const [y, m, d] = f.split('-').map(Number);
    const pl = store.get('plazos', []).filter(p => p.fecha >= hoy0() - 30 * diaMs);  // los muy viejos se van solos
    pl.push({ id: 'p' + Date.now(), texto: tx, fecha: new Date(y, m - 1, d).getTime() });
    store.set('plazos', pl); programarAvisos(); pintar();
  };
  $app.querySelectorAll('[data-borrapl]').forEach(x => { x.onclick = () => {
    store.set('plazos', store.get('plazos', []).filter(p => p.id !== x.dataset.borrapl)); programarAvisos(); pintar();
  }; });
}

// ── Avisos con la app cerrada: se programan en el propio móvil (sin servidor) ──
// Días de publicación (1 y 15) a las 10:00 durante los próximos meses, y cada plazo el día antes y el mismo día.
function programarAvisos() {
  if (!NAV || !NAV.avisos) return;
  const lista = [];
  if (store.get('avisosOn', true) && perfil) {
    const ahora = new Date();
    for (let i = 0; i < 6; i++) for (const dia of [1, 15]) {
      const f = new Date(ahora.getFullYear(), ahora.getMonth() + i, dia, 10, 0, 0);
      if (f > ahora) lista.push({ id: 'pub' + f.getTime(), fecha: f.getTime(), titulo: t('avPubT'), texto: t('avPubTxt') });
    }
    for (const p of store.get('plazos', [])) {
      const antes = p.fecha - diaMs + 10 * 3600e3, mismo = p.fecha + 9 * 3600e3;
      if (antes > Date.now()) lista.push({ id: p.id + 'a', fecha: antes, titulo: t('avPlazT', p.texto), texto: t('avPlazTxt') });
      if (mismo > Date.now()) lista.push({ id: p.id + 'b', fecha: mismo, titulo: t('avPlazHoyT', p.texto), texto: t('avPlazTxt') });
    }
  }
  lista.sort((a, b) => a.fecha - b.fecha);
  NAV.avisos({ avisos: lista.slice(0, 40) }).catch(() => {});
}

// ── Anuncios (AdMob, complemento @capacitor-community/admob) ──
// Banner abajo (encima de las pestañas), uno de «carga de aplicación» siempre al abrir la app y un
// intersticial como mucho cada `cadaMin` minutos al acabar una búsqueda o al cambiar de pestaña. Con «premium» no sale ninguno.
// Antes se pide el consentimiento que exige la UE (formulario de Google) y, en iPhone, el permiso de seguimiento.
const ES_IOS = !!(window.Capacitor && Capacitor.getPlatform && Capacitor.getPlatform() === 'ios');
const ADS = ES_IOS
  ? { activo: true, banner: 'ca-app-pub-1535697166232113/9848585686', inicio: 'ca-app-pub-1535697166232113/8846048090', inter: 'ca-app-pub-1535697166232113/6212593004', cadaMin: 2 }
  : { activo: true, banner: 'ca-app-pub-1535697166232113/3454120610', inicio: 'ca-app-pub-1535697166232113/6709793163', inter: 'ca-app-pub-1535697166232113/1732798652', cadaMin: 2 };
const ADMOB = () => window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform() && Capacitor.Plugins && Capacitor.Plugins.AdMob;
const conAnuncios = () => ADS.activo && !store.get('premium', false) && !!ADMOB();
let ultimoInter = 0, adsListos = false;
async function anunciosIniciar() {
  if (!conAnuncios()) return;
  const A = ADMOB();
  try {
    let c = await A.requestConsentInfo();
    if (c.isConsentFormAvailable && c.status === 'REQUIRED') c = await A.showConsentForm();
    if (c && c.canRequestAds === false) return;
    if (ES_IOS) { try { await A.requestTrackingAuthorization(); } catch (e) {} }
    await A.initialize();
    adsListos = true;
    document.body.classList.add('con-anuncio');
    const alto = (document.getElementById('tabs').offsetHeight || 64);
    A.showBanner({ adId: ADS.banner, adSize: 'ADAPTIVE_BANNER', position: 'BOTTOM_CENTER', margin: alto }).catch(() => {});
    try { await A.loadAppOpen({ adId: ADS.inicio }); await A.showAppOpen(); ultimoInter = Date.now(); } catch (e) {}  // siempre uno al abrir
  } catch (e) {}
}
async function anuncioPantalla(id) {
  if (!adsListos || !conAnuncios() || !id || actualizando) return;
  try { await ADMOB().prepareInterstitial({ adId: id }); await ADMOB().showInterstitial(); ultimoInter = Date.now(); } catch (e) {}
}
function anuncioCadaTanto() { if (Date.now() - ultimoInter > ADS.cadaMin * 60000) anuncioPantalla(ADS.inter); }

// Pestaña Bolsa: actividad y penalizaciones se cargan solas al entrar (como mucho cada 12 h)
function extrasAuto() {
  if (pestana !== 'bolsa' || actualizando || !perfil || !NAV) return;
  if (Date.now() - store.get('extrasFecha', 0) < 12 * 3600e3) return;
  setTimeout(() => { if (pestana === 'bolsa' && !actualizando) actualizarExtras(false); }, 400);
}

function pintar() {
  document.getElementById('hSub').textContent = t('sub');
  document.getElementById('bLang').textContent = lang === 'es' ? 'VAL' : 'CAS';
  document.documentElement.lang = lang === 'va' ? 'ca' : 'es';
  if (!perfil) { barraPestanas(false); return pantallaPerfil(); }
  $app.onclick = null; $app.oninput = null; $app.onchange = null;
  barraPestanas(true);
  const varias = perfil.bolsas.length > 1;
  const grupo = b => varias ? `<div class="grupo">${esc(catCorta(b.cat))} · ${turnoTxt(b.turno)}</div>` : '';
  let html = '';
  if (pestana === 'evol') {
    const partes = perfil.bolsas.map(b => { const x = b.deps.map(d => evolucionCard(b, d)).join('') + comparar(b); return x ? grupo(b) + x : ''; }).join('');
    html = (partes || `<div class="card"><div class="note" style="margin:0">${t('evolVacia')}</div></div>`) + simuladorCard();
  } else if (pestana === 'bolsa') {
    const hay = Object.keys(store.get('actividad', {})).length || Object.keys(store.get('penal', {})).length;
    const fx = store.get('extrasFecha', 0);
    const fxTxt = fx ? new Date(fx).toLocaleString(lang === 'va' ? 'ca-ES' : 'es-ES', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
    html = `<div class="card"><div class="note" style="margin:0 0 10px">${hay && fx ? t('extraNota2', esc(fxTxt)) : t('extraNota')}</div><button class="sec" id="bExtra">↻ ${t('extraBtn')}</button></div>`
      + penalCard() + [...new Set(perfil.bolsas.map(b => b.cat))].map(c => actividadCard(c) + rankingCard(c)).join('');
  } else if (pestana === 'zona') {
    html = `<div class="card"><h2>${t('zonaT')}</h2>
        <button class="ajuste" id="aBolsas">📋 ${t('bEdit')}<i>›</i></button>
        <button class="ajuste" id="aBar">${t('bBaremo')}<i>›</i></button></div>`
      + puntosCard() + plazosCard();
  } else if (pestana === 'ajustes') {
    const reg = store.get('registro', []);
    html = `<div class="card"><h2>${t('ajustesT')}</h2>
        <div class="ajuste" style="cursor:default">🌐 ${t('idioma')}<div class="seg" id="aLang" style="width:150px"><button data-v="es" class="${lang === 'es' ? 'on' : ''}">CAS</button><button data-v="va" class="${lang === 'va' ? 'on' : ''}">VAL</button></div></div>
        <div class="ajuste" style="cursor:default">${t('apar')}<div class="seg" id="aTema" style="width:190px">${['auto', 'light', 'dark'].map((v, i) => `<button data-v="${v}" class="${store.get('tema', 'auto') === v ? 'on' : ''}">${t(['aAuto', 'aClaro', 'aOscuro'][i])}</button>`).join('')}</div></div>
        ${ADMOB() ? `<button class="ajuste" id="aPriv">🛡️ ${t('privAds')}<i>›</i></button>` : ''}
        <a class="ajuste" href="${pedirUrl()}">${t('pedir')}<i>›</i></a>
        <a class="ajuste" href="https://mjtbapps.github.io/GVA-SALUT/privacidad.html" target="_blank" rel="noopener">📄 ${t('privPol')}<i>↗︎</i></a>
        <label class="check" style="margin-top:6px"><input type="checkbox" id="aAv" ${store.get('avisosOn', true) ? 'checked' : ''}> ${t('avTxt')}</label>
        <label class="check" style="margin-top:6px"><input type="checkbox" id="aVer" ${store.get('ver', false) ? 'checked' : ''}> ${t('verWebC')}</label></div>
      ${premiumCard()}
      ${oficialCard()}
      ${reg.length ? `<details class="card reg"><summary>${t('detalles')}</summary><pre>${reg.map(esc).join('\n')}</pre></details>` : ''}`;
  } else {
    pestana = 'inicio';
    const fechas = [];
    perfil.bolsas.forEach(b => b.deps.forEach(d => { const x = datos[clave(b, d)]; if (x && x.fecha) fechas.push(x.fecha); }));
    const cuando = fechas.length ? new Date(Math.min(...fechas)).toLocaleString(lang === 'va' ? 'ca-ES' : 'es-ES', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }) : t('nunca');
    const errores = store.get('errores', []);
    const pub = store.get('ultimaPub', '') || (Object.values(datos).find(x => x && x.pub) || {}).pub || '';
    // Primero las bolsas donde te ha encontrado; las que no, al final
    const orden = (b, d) => { const x = datos[clave(b, d)]; return x && x.identificado && !x.encontrado ? 1 : 0; };
    html = `<div class="bar"><span class="when">${t('actualizado')}: ${esc(cuando)}</span><span><button class="sec" id="bAct">↻ ${t('bAct')}</button></span></div>
      ${errores.length ? '<div class="err">' + errores.map(esc).join('<br>') + '</div><br>' : ''}
      ${avisos()}
      ${quincenaCard()}
      ${perfil.bolsas.map(b => grupo(b) + b.deps.slice().sort((x, y) => orden(b, x) - orden(b, y)).map(d => tarjeta(b, d)).join('')).join('')}
      ${calendarioCard()}
      ${pub ? '<div class="note" style="padding:0 6px">' + t('pubT') + ': ' + esc(fechaTxt(pub) || pub) + '</div>' : ''}`;
  }
  $app.innerHTML = html + pie();
  const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };
  on('bAct', () => actualizar());
  on('bExtra', () => actualizarExtras(true));
  on('aBolsas', pantallaPerfil);
  on('aBar', pantallaBaremo);
  on('bNov', () => { store.set('novedades', null); pintar(); });
  const al = document.getElementById('aLang');
  if (al) al.onclick = e => { const b = e.target.closest('button'); if (b) { lang = b.dataset.v; store.set('lang', lang); pintar(); } };
  const at = document.getElementById('aTema');
  if (at) at.onclick = e => { const b = e.target.closest('button'); if (b) { store.set('tema', b.dataset.v); ponerTema(); pintar(); } };
  const av = document.getElementById('aVer');
  if (av) av.onchange = () => { verVisible = av.checked; store.set('ver', verVisible); };
  $app.querySelectorAll('[data-share]').forEach(x => { x.onclick = () => compartir(x.dataset.share); });
  $app.querySelectorAll('[data-revisar]').forEach(x => { x.onclick = pantallaPerfil; });
  $app.querySelectorAll('[data-reintentar]').forEach(x => { x.onclick = () => actualizar(); });
  $app.querySelectorAll('[data-per]').forEach(x => { x.onclick = () => { store.set('actPer', x.dataset.per); const y = scrollY; pintar(); scrollTo(0, y); }; });
  $app.querySelectorAll('[data-sit]').forEach(x => { x.onclick = () => explicarSit(x.dataset.sit); });
  const aa = document.getElementById('aAv');
  if (aa) aa.onchange = () => { store.set('avisosOn', aa.checked); programarAvisos(); };
  on('bPrem', () => premiumAccion(false));
  on('bPremR', () => premiumAccion(true));
  on('aPriv', () => { const A = ADMOB(); if (A) A.showPrivacyOptionsForm().catch(() => {}); });
  enlazarPlazos(); enlazarSimulador(); enlazarPuntos();
}
// ── Premium: pago único (3,99 €) que quita los anuncios. Producto «mibolsa_premium» en App Store Connect y Play Console ──
const premiumNativo = () => !!(NAV && NAV.premiumEstado);
function premiumCard() {
  if (!premiumNativo()) return '';
  if (store.get('premium', false)) return `<div class="card"><h3>${t('premT')}</h3><div class="note" style="margin:0">${t('premSi')}</div></div>`;
  const precio = store.get('premPrecio', '') || '3,99 €';
  return `<div class="card"><h3>${t('premT')}</h3><div class="note" style="margin:0 0 12px">${t('premTxt')}</div>
    <button class="main" id="bPrem">${t('premBtn', esc(precio))}</button>
    <button class="link" id="bPremR" style="display:block;margin:6px auto 0">${t('premRest')}</button></div>`;
}
function quitarAnuncios() {
  const A = ADMOB();
  document.body.classList.remove('con-anuncio');
  adsListos = false;
  if (A) { A.removeBanner().catch(() => {}); }
}
async function premiumComprobar() {
  if (!premiumNativo()) return;
  try {
    const r = await Promise.race([NAV.premiumEstado(), sleep(4000).then(() => null)]);
    if (!r) return;
    if (r.precio) store.set('premPrecio', r.precio);
    if (r.premium) { store.set('premium', true); quitarAnuncios(); }
    else if (r.fiable && store.get('premium', false)) store.set('premium', false);  // reembolsada
  } catch (e) {}
}
async function premiumAccion(restaurar) {
  try {
    const r = restaurar ? await NAV.premiumRestaurar() : await NAV.premiumComprar();
    if (r.precio) store.set('premPrecio', r.precio);
    if (r.premium) { store.set('premium', true); quitarAnuncios(); alert(t('premOk')); }
    else if (r.pendiente) alert(t('premPend'));
    else if (restaurar) alert(t('premNo'));
  } catch (e) { alert(t('premErr', (e && e.message) || e)); }
  pintar();
}
const pedirUrl = () => 'mailto:mjtbapps@gmail.com?subject=' + encodeURIComponent(t('pedirAsunto')) + '&body=' + encodeURIComponent('Categoría / Categoria:\nDepartamento / Departament:\nTurno / Torn:\n');

document.getElementById('bLang').onclick = () => {
  lang = lang === 'es' ? 'va' : 'es'; store.set('lang', lang);
  if (document.getElementById('fOk')) pantallaPerfil(); else if (document.getElementById('vTot')) pantallaBaremo(); else pintar();
};

verVisible = store.get('ver', false);
pintar();
// Al abrir la app (y al volver a ella): si los datos tienen más de 6 horas se actualiza;
// si no, se mira si la GVA ha sacado una publicación nueva y entonces se actualiza.
const viejo = () => perfil && perfil.bolsas.some(b => b.deps.some(d => { const x = datos[clave(b, d)]; return !x || Date.now() - x.fecha > 6 * 3600e3; }));
document.getElementById('ovX').onclick = () => { cancelado = true; paso('Cancelada por ti'); ovOff(); };
const alAbrir = () => { if (viejo()) actualizar(); else comprobarPublicacion(); };
programarAvisos();
// Primero el consentimiento y el anuncio de apertura; después la búsqueda
premiumComprobar().then(anunciosIniciar).finally(() => { alAbrir(); extrasAuto(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) alAbrir(); });
</script>
